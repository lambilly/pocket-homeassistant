# ==========================================================
# Pocket HomeAssistant —— 远程控制包（v2.1）
# ----------------------------------------------------------
# 放到 /config/packages/ 下，并在 configuration.yaml 里确认有：
#   homeassistant:
#     packages: !include_dir_named packages
#
# 解决什么问题：
#   屏幕带出门后，Native API 那条控制线会断（HA 连不到设备），
#   只有 MQTT（设备主动往外连）还活着。本包把这 5 项也挂到 MQTT 上：
#     屏幕开关 / 亮度 / 熄屏超时 / 自动休眠 / 通知亮屏
#   主题约定（与设备端 pocket-homeassistant.yaml 一一对应）：
#     下发  home/pocket-homeassistant/cmd/<key>     retain + QoS1
#     回读  esphome/pocket-homeassistant/state      retain + QoS1
#
# 注意：
#   · 这 5 个实体和设备原生 API 出来的那 5 个是**两套**。在局域网时
#     两套都能用；出门后只有这套能用。
#   · 设备名「Pocket HA Remote」，实体名不带前缀。每个实体显式写了 `object_id`，
#     所以 entity_id 恒为 number.pkha_remote_brightness 这类固定值——
#     改设备显示名不会连带改 entity_id，卡片与自动化不会断。
#   · 故意挂在独立设备下（MQTT 集成），与 ESPHome 设备分开——
#     外网通道就是它存在的意义。同机还有旧项目那台「HA Monitor Remote」，
#     两台靠 identifiers 区分（本包 `pkha_remote` / 旧包 `ha_monitor_display_remote`）。
#   · cmd 主题 retain，所以设备重启/重连会重放最后一次下发的值，
#     即「重启后以 HA 侧为准」。
#   · unique_id 稳定不可改；display name 改动只影响显示与 entity_id 生成。
#   · 设备 identifiers 为 `pkha_remote`（v3.5 起统一改为本项目名，不再沿用旧项目
#     `ha_monitor_display_remote`，避免两台设备在 HA 里合并成一台）。
#     代价：HA 里会新建一条「Pocket HA Remote」设备记录，旧记录变成没有实体的残留，
#     在「设置 → 设备与服务 → MQTT」里手动删一次即可。
#     收益：unique_id 未变 + object_id 固定，实体 ID、历史数据、卡片引用都不受影响。
# ==========================================================

mqtt:
  light:
    # 屏幕开关：开 = 唤醒到上次亮度（不是满亮）；关 = 熄屏（记住当前亮度）
    - name: "Screen Power"
      unique_id: pkha_remote_light
      object_id: pkha_remote_screen_power
      icon: mdi:monitor
      command_topic: home/pocket-homeassistant/cmd/light
      state_topic: esphome/pocket-homeassistant/state
      state_value_template: "{{ 'ON' if value_json.light else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      retain: true
      qos: 1
      device:
        identifiers: [pkha_remote]
        name: "Pocket HA Remote"

  number:
    # 亮度百分比（设备端限制 10~100，低于 10 会被钳到 10）
    - name: "Brightness"
      unique_id: pkha_remote_brightness
      object_id: pkha_remote_brightness
      icon: mdi:brightness-percent
      command_topic: home/pocket-homeassistant/cmd/bright
      state_topic: esphome/pocket-homeassistant/state
      value_template: "{{ value_json.bright }}"
      min: 10
      max: 100
      step: 5
      mode: slider
      unit_of_measurement: "%"
      retain: true
      qos: 1
      device:
        identifiers: [pkha_remote]
        name: "Pocket HA Remote"

    # 熄屏超时（秒），设备端范围 15~900
    - name: "Sleep Timeout"
      unique_id: pkha_remote_sleep
      object_id: pkha_remote_sleep_timeout
      icon: mdi:timer-outline
      command_topic: home/pocket-homeassistant/cmd/sleep
      state_topic: esphome/pocket-homeassistant/state
      value_template: "{{ value_json.sleep }}"
      min: 15
      max: 900
      step: 5
      mode: box
      unit_of_measurement: "s"
      retain: true
      qos: 1
      device:
        identifiers: [pkha_remote]
        name: "Pocket HA Remote"

  switch:
    # 自动休眠总开关（关掉 = 常亮，适合演示/调试）
    - name: "Auto Sleep"
      unique_id: pkha_remote_autosleep
      object_id: pkha_remote_auto_sleep
      icon: mdi:sleep
      command_topic: home/pocket-homeassistant/cmd/autosleep
      state_topic: esphome/pocket-homeassistant/state
      value_template: "{{ 'ON' if value_json.autosleep else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      retain: true
      qos: 1
      device:
        identifiers: [pkha_remote]
        name: "Pocket HA Remote"

    # 收到通知时是否点亮屏幕（默认关，省电优先）
    - name: "Notify Wake"
      unique_id: pkha_remote_notify_wake
      object_id: pkha_remote_notify_wake
      icon: mdi:bell-ring
      command_topic: home/pocket-homeassistant/cmd/wake
      state_topic: esphome/pocket-homeassistant/state
      value_template: "{{ 'ON' if value_json.wake else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      retain: true
      qos: 1
      device:
        identifiers: [pkha_remote]
        name: "Pocket HA Remote"
