# ==========================================================
# PKHA Remote —— 屏幕远程控制卡片（亮度整行 + 其余 2×2）
# ----------------------------------------------------------
# 布局（用户 11-04 指定）：
#   行1  屏幕亮度（整行跨两列，点按弹滑块）
#   行2  屏幕开关        | 通知亮屏
#   行3  熄屏超时        | 自动休眠
#
# 样式对齐概览页既有卡：mushroom-template-card（圆图标在左、
# 标题在上、状态小字在下），配色开=绿/关=灰、数值=amber。
# 标题统一四字。
#
# 实体（真机已确认的 entity_id）：
#   light.pkha_remote_screen_power / number.pkha_remote_brightness /
#   number.pkha_remote_sleep_timeout / switch.pkha_remote_auto_sleep /
#   switch.pkha_remote_notify_wake
#
# 用法：概览页 → 铅笔 → 添加卡片 → 手动 → 粘贴整段。
# ==========================================================
type: vertical-stack
cards:
  # ---------- 行1：屏幕亮度（整行，带拉动条） ----------
  # mushroom-number-card 的 slider 模式是蘑菇卡里唯一原生滑块；
  # 拖动即下发（约 1s 节流），屏幕亮度会跟着实时变——对调亮度来说正好。
  - type: custom:mushroom-number-card
    entity: number.pkha_remote_brightness
    name: 屏幕亮度
    icon: mdi:brightness-percent
    icon_color: amber
    display_mode: slider
    layout: horizontal

  # ---------- 行2~3：其余 4 个，2 列 ----------
  - type: grid
    columns: 2
    square: false
    cards:
      # 行2 左：屏幕开关
      - type: custom:mushroom-template-card
        entity: light.pkha_remote_screen_power
        icon: |
          {{ 'mdi:monitor' if is_state(entity, 'on') else 'mdi:monitor-off' }}
        primary: 屏幕开关
        secondary: |
          {{ ('已点亮 · ' ~ states('number.pkha_remote_brightness') | int(0) ~ '%') if is_state(entity, 'on') else '已熄屏' }}
        color: |
          {{ 'green' if is_state(entity, 'on') else 'grey' }}
        tap_action:
          action: perform-action
          perform_action: light.toggle
          target:
            entity_id: light.pkha_remote_screen_power

      # 行2 右：通知亮屏
      - type: custom:mushroom-template-card
        entity: switch.pkha_remote_notify_wake
        icon: |
          {{ 'mdi:bell-ring' if is_state(entity, 'on') else 'mdi:bell-off' }}
        primary: 通知亮屏
        secondary: |
          {{ '开启' if is_state(entity, 'on') else '关闭' }}
        color: |
          {{ 'orange' if is_state(entity, 'on') else 'grey' }}
        tap_action:
          action: perform-action
          perform_action: switch.toggle
          target:
            entity_id: switch.pkha_remote_notify_wake

      # 行3 左：熄屏超时（15~900s 跨度大，点按弹输入框精确改）
      - type: custom:mushroom-template-card
        entity: number.pkha_remote_sleep_timeout
        icon: mdi:timer-sand
        primary: 熄屏超时
        secondary: |
          {% set s = states(entity) | int(0) %}
          {% if s % 60 == 0 %}{{ s // 60 }} 分钟{% elif s < 60 %}{{ s }} 秒{% else %}{{ s // 60 }} 分 {{ s % 60 }} 秒{% endif %}
        color: amber
        tap_action:
          action: more-info

      # 行3 右：自动休眠
      - type: custom:mushroom-template-card
        entity: switch.pkha_remote_auto_sleep
        icon: |
          {{ 'mdi:sleep' if is_state(entity, 'on') else 'mdi:sleep-off' }}
        primary: 自动休眠
        secondary: |
          {{ '开启' if is_state(entity, 'on') else '关闭' }}
        color: |
          {{ 'green' if is_state(entity, 'on') else 'grey' }}
        tap_action:
          action: perform-action
          perform_action: switch.toggle
          target:
            entity_id: switch.pkha_remote_auto_sleep
