# 屏幕在线检测（MQTT 心跳）
# 部署位置：/config/packages/pocket_display_online.yaml
#
# 原理：屏幕 pocket-homeassistant 通过 MQTT 每约 9 秒上报一次 free_heap 等传感器数据，
#      这里订阅该心跳 topic；45 秒收不到任何消息即超时（expire_after）→ 实体变 unavailable，
#      模板里把「非 on」一律视为离线。
#
# 为什么不用 status / LWT 主题（esphome/pocket-homeassistant/status）：
#   LWT 只在 TCP 断开时由 broker 代发 offline，WiFi 半死（TCP 未断但设备不工作）时会一直停在 online；
#   心跳超时能覆盖这种情况，更贴合"屏幕到底还在不在"。
#
# 注意：不要把 binary_sensor 的 off 当作离线判据 —— 只有 on / unavailable 两种结果。

mqtt:
  binary_sensor:
    - name: "屏幕在线"
      unique_id: pkha_screen_online
      default_entity_id: binary_sensor.pkha_screen_online
      device_class: connectivity
      icon: mdi:monitor
      state_topic: "esphome/pocket-homeassistant/sensor/free_heap/state"
      value_template: "online"
      payload_on: "online"
      payload_off: "offline"
      expire_after: 45
