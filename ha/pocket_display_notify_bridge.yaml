# ==========================================================
# Pocket HomeAssistant —— 通知桥接（HA 页 ↔ 屏幕通知页）
# ----------------------------------------------------------
# 安装位置：/config/packages/pocket_display_notify_bridge.yaml
#   （configuration.yaml 已有 packages: !include_dir_named packages）
# 生效：开发者工具 → YAML → 「重新加载 所有 YAML 配置」
#   （新增实体需要一次 HA 重启才会出现；此包不改动原首页）
#
# 作用：
#   1. 订阅屏幕通知主题 home/pocket-homeassistant/notify，
#      把「屏幕上正显示的那一条」暴露成 sensor.pkha_last_notify，
#      供 HA「屏幕镜像 → 通知」页显示。
#   2. 反向：在 HA 里输入一段文字 → 推进屏幕通知页。
#
# payload 格式（与固件 on_message 解析一致）：
#   {"title": "门锁", "message": "前门已开启", "ts": 1793804000}
#   ts 单位秒（毫秒会自动除以 1000，但这里直接给秒）
# ==========================================================

mqtt:
  sensor:
    - name: "PKHA Last Notify"
      unique_id: pkha_last_notify
      object_id: pkha_last_notify
      icon: mdi:bell-ring-outline
      state_topic: "home/pocket-homeassistant/notify"
      value_template: >-
        {{ value_json.message if value_json is defined and value_json.message is defined
           else value }}
      json_attributes_topic: "home/pocket-homeassistant/notify"
      json_attributes_template: >-
        {{ {'title': value_json.title | default(''),
            'ts': value_json.ts | default(0),
            'payload': value} | tojson }}
      qos: 1
      device:
        identifiers: [pkha_remote]
        name: "Pocket HA Remote"

input_text:
  pkha_notify_text:
    name: PKHA 通知内容
    max: 255
    icon: mdi:message-text

input_boolean:
  pkha_notify_send:
    name: PKHA 立即发送通知
    icon: mdi:send

automation:
  - id: pkha_notify_send
    alias: "PKHA: 发送通知到屏幕"
    description: >-
      input_boolean 置 on → 把 input_text 的内容按屏幕格式 publish 到
      home/pocket-homeassistant/notify，然后清空输入并复位开关
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: input_boolean.pkha_notify_send
        from: "off"
        to: "on"
    conditions:
      # 空值 / unknown / unavailable 一律不发（否则会把 "unknown" 当正文推上屏）
      - condition: template
        value_template: >-
          {{ states('input_text.pkha_notify_text') | trim not in ['', 'unknown', 'unavailable']
             and (states('input_text.pkha_notify_text') | trim | length) > 0 }}
    actions:
      - action: mqtt.publish
        data:
          topic: home/pocket-homeassistant/notify
          retain: false
          qos: 1
          payload: >-
            {{ {'title': 'HA 通知',
                'message': states('input_text.pkha_notify_text'),
                'ts': now().timestamp() | int} | tojson }}
      - delay:
          milliseconds: 300
      - action: input_text.set_value
        target:
          entity_id: input_text.pkha_notify_text
        data:
          value: ""
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.pkha_notify_send
