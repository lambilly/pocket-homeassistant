        # ============ 底部四键 TAB（四页共用，见 ui/tab_bar.yaml） ============
        - !include tab_bar.yaml

# --- 本页数据刷新 ---
interval:
  - interval: 2s
    then:
      - lambda: |-
          if (!id(lvgl_ready)) return;
          if (id(ui_screen_off)) return;      // 熄屏时不再刷控件，省 CPU/SPI
          if (id(ui_current_page) != 0) return;

          char buf[96];

          // ===== 行1：中文时间 / 天气 / 上证指数 =====
          if (id(ha_time_text).has_state() && !id(ha_time_text).state.empty()) {
            lv_label_set_text(id(home_time_label), id(ha_time_text).state.c_str());
          } else {
            auto now = id(system_time).now();
            if (now.is_valid()) {
              static const char* wk[] = {"日","一","二","三","四","五","六"};
              int w = now.day_of_week - 1; if (w < 0) w = 0;
              snprintf(buf, sizeof(buf), "%d年%d月%d日 星期%s",
                       now.year, now.month, now.day_of_month, wk[w]);
              lv_label_set_text(id(home_time_label), buf);
            }
          }

          // 天气：把 weather 实体的英文 state 映射为中文，并在后面附上温度
          {
            static const std::vector<std::pair<const char*, const char*>> wx = {
              {"clear-night", "晴夜"}, {"cloudy", "多云"}, {"exceptional", "极端"},
              {"fog", "雾"}, {"hail", "冰雹"}, {"lightning", "雷雨"},
              {"lightning-rainy", "雷阵雨"}, {"partlycloudy", "多云"}, {"pouring", "暴雨"},
              {"rainy", "雨"}, {"snowy", "雪"}, {"snowy-rainy", "雨夹雪"},
              {"sunny", "晴"}, {"windy", "大风"}, {"windy-variant", "大风"},
            };
            std::string cond = id(ha_weather).state;
            std::string cn = "";
            for (auto &p : wx) if (cond == p.first) { cn = p.second; break; }

            // 温度：优先用天气实体的 temperature 属性，退而使用独立的室外温度传感器
            char tbuf[16] = "";
            float t = NAN;
            if (id(ha_weather_temperature).has_state()) t = id(ha_weather_temperature).state;
            else if (id(outdoor_temperature).has_state()) t = id(outdoor_temperature).state;
            if (std::isfinite(t)) snprintf(tbuf, sizeof(tbuf), " %.0f℃", t);

            char wbuf[40];
            if (cn.empty()) snprintf(wbuf, sizeof(wbuf), "#757575 --#%s", tbuf);
            else snprintf(wbuf, sizeof(wbuf), "%s%s", cn.c_str(), tbuf);
            lv_label_set_text(id(home_weather_label), wbuf);
            // 名称段继承基色白；无数据时仅 "--" 内联灰
            lv_obj_set_style_text_color(id(home_weather_label), lv_color_hex(0xFFFFFF), 0);
          }

          // 上证指数：数值文本 + 整体着色
          //   涨跌看 ha_stock_chg（推送自 sensor.mei_ri_gu_zhi 属性 Sh000001.changeRatio）
          //   >0 涨红 / <0 跌绿 / =0 平白 / 无数据灰（图标、"上证:"前缀、数值三件套同步）
          {
            const bool has_txt = id(ha_stock).has_state() && !id(ha_stock).state.empty();
            lv_label_set_text(id(home_stock_label), has_txt ? id(ha_stock).state.c_str() : "--");
            const float chg = id(ha_stock_chg).state;
            const uint32_t sc = std::isfinite(chg)
                                ? (chg > 0.0f ? 0xFF5252 : (chg < 0.0f ? 0x59D98B : 0xFFFFFF))
                                : 0x757575;
            lv_obj_set_style_text_color(id(home_stock_icon),   lv_color_hex(sc), 0);
            lv_obj_set_style_text_color(id(home_stock_prefix), lv_color_hex(sc), 0);
            lv_obj_set_style_text_color(id(home_stock_label),  lv_color_hex(sc), 0);
          }

          // ===== 行2：四格（在家 / 客人 / 手机 / 语音）=====
          // 名称恒白（静态字统一白）；数值保留动态色；**图标恒为规划基色**：
          //   在家  图标橙 FFB74D / 客人 图标紫 B39DFF / 手机 图标蓝 5AA9FF
          //   数值   >0 → 基色；=0 或无数据 → 灰 757575
          // 图标是「这是哪一格」的定位锚点，不随数值状态灰化/白化 —
          // 否则没客人时整格无色，四格之间就分不出谁是谁了。
          // 数值靠 recolor 内联着色（label 需 recolor: true）："在家: #FFB74D 3#"
          auto set_cnt_color = [](lv_obj_t* lbl, lv_obj_t* icon, esphome::sensor::Sensor* s,
                                  const char* name, uint32_t on_color) {
            char b[64];
            const bool has = std::isfinite(s->state);
            const uint32_t vc = (has && s->state > 0.0f) ? on_color : 0x757575;
            if (!has) {
              snprintf(b, sizeof(b), "%s: #757575 --#", name);
            } else {
              snprintf(b, sizeof(b), "%s: #%02X%02X%02X %d#", name,
                       (unsigned) ((vc >> 16) & 0xFF), (unsigned) ((vc >> 8) & 0xFF),
                       (unsigned) (vc & 0xFF), (int) s->state);
            }
            lv_label_set_text(lbl, b);
            lv_obj_set_style_text_color(lbl,  lv_color_hex(0xFFFFFF), 0);
            lv_obj_set_style_text_color(icon, lv_color_hex(on_color), 0);   // 图标恒基色
          };
          set_cnt_color(id(home_server_label),  id(home_server_icon),  id(ha_family_home),  "在家", 0xFFB74D);
          set_cnt_color(id(home_gateway_label), id(home_gateway_icon), id(ha_guest_visit),  "客人", 0xB39DFF);
          set_cnt_color(id(home_ap_label),      id(home_ap_icon),      id(ha_phone_online), "手机", 0x5AA9FF);
          // 语音广播是开关实体：名称白 / 数值 开=绿 / 关=红 / 无数据灰 + "--"
          // 图标与前三个逻辑一致：恒为规划基色绿 59D98B（格位锚点，不随状态变色）
          {
            const bool has_v = id(ha_voice_broadcast).has_state();
            const bool on_v  = has_v && id(ha_voice_broadcast).state;
            const uint32_t vc = !has_v ? 0x757575 : (on_v ? 0x59D98B : 0xFF5252);
            char vb[48];
            if (!has_v) {
              snprintf(vb, sizeof(vb), "语音: #757575 --#");
            } else {
              snprintf(vb, sizeof(vb), "语音: #%02X%02X%02X %s#",
                       (unsigned) ((vc >> 16) & 0xFF), (unsigned) ((vc >> 8) & 0xFF),
                       (unsigned) (vc & 0xFF), on_v ? "开" : "关");
            }
            lv_label_set_text(id(home_monitor_label), vb);
            lv_obj_set_style_text_color(id(home_monitor_label), lv_color_hex(0xFFFFFF), 0);
            lv_obj_set_style_text_color(id(home_monitor_icon), lv_color_hex(0x59D98B), 0);   // 图标恒绿
          }

          // ===== 行3：居家模式（在家橙/离家红/休息紫/影音黄）+ 活动轨迹（黄）/ 车位状态 =====
          // 用 LVGL 的 recolor 语法在同一 label 内分段着色：
          //   "#59D98B 在家# #FFD54F 客厅#"
          // 这样两段文字自然连排、无需测量宽度，也不依赖 lv_text_get_size
          // 之类版本敏感的 API（LVGL v8→v9 曾改名导致编译失败）。
          {
            const std::string& mode = id(ha_home_mode).state;
            const std::string& act  = id(ha_activity_log).state;
            bool has_mode = id(ha_home_mode).has_state() && !mode.empty()
                            && mode != "unknown" && mode != "unavailable";
            bool has_act  = id(ha_activity_log).has_state() && !act.empty()
                            && act != "unknown" && act != "unavailable";

            // recolor 语法里的 '#' 是控制符，实体内容若自带 '#' 必须剔除，
            // 否则会造成着色错乱或显示异常。
            auto strip_hash = [](const std::string& src) {
              std::string dst;
              dst.reserve(src.size());
              for (char c : src) if (c != '#') dst.push_back(c);
              return dst;
            };

            char mbuf[192];
            std::string m = has_mode ? strip_hash(mode) : "居家模式";
            std::string a = has_act  ? strip_hash(act)  : "";

            // 着色规则（10-31 十二轮，用户定）：
            //   **模式色同时上图标与模式文字（文字随图标一起变）**
            //     在家=橙 FFB74D / 离家=红 FF5252 / 休息=紫 B39DFF / 影音=黄 FFD54F
            //     其余模式与无数据=白（兜底）
            //   活动轨迹段恒白；无活动=灰 757575 占位 "--"
            const char* mcol = "FFFFFF";
            if      (m.find("在家") != std::string::npos) { mcol = "FFB74D"; }
            else if (m.find("离家") != std::string::npos) { mcol = "FF5252"; }
            else if (m.find("休息") != std::string::npos) { mcol = "B39DFF"; }
            else if (m.find("影音") != std::string::npos) { mcol = "FFD54F"; }
            lv_obj_set_style_text_color(id(home_mode_icon),
                                        lv_color_hex((uint32_t) strtoul(mcol, nullptr, 16)), 0);

            // 音量百分比（10-31 二十轮改位）：sensor.ju_jia_mo_shi 的 volume_percent 属性
            //   位置在**模式之后、活动轨迹之前**；11-02 用户定：改为固定色 蓝 5AA9FF
            //   （语音/声音语义色，与四种模式色均不撞），不再随模式字变色；
            //   属性缺失时不显示（不占位、也不出 --）
            char vseg[32] = "";
            if (std::isfinite(id(ha_mode_volume).state))
              snprintf(vseg, sizeof(vseg), " #5AA9FF %.0f%%#", id(ha_mode_volume).state);

            if (has_act && has_mode) {
              snprintf(mbuf, sizeof(mbuf), "#%s %s#%s #FFFFFF %s#", mcol, m.c_str(), vseg, a.c_str());
            } else if (has_act) {
              // 无模式状态时 mcol 为白，百分比仍排在轨迹之前
              snprintf(mbuf, sizeof(mbuf), "%s #FFFFFF %s#", vseg[0] ? vseg + 1 : "", a.c_str());
            } else if (has_mode) {
              // 无活动轨迹：占位 "--" 用灰，与车位/电灯等无数据写法一致
              snprintf(mbuf, sizeof(mbuf), "#%s %s#%s #757575 --#", mcol, m.c_str(), vseg);
            } else {
              snprintf(mbuf, sizeof(mbuf), "#FFFFFF 居家模式# #757575 --#");
            }
            lv_label_set_text(id(home_mode_label), mbuf);
          }
          // 车位状态着色（10-31 十二轮，用户定）：**状态字随图标一起变色**
          //   空闲=绿 59D98B / 比亚迪=粉 FF80AB / 轩逸=黄 FFD54F / 其他与无数据=白
          //   前缀"车位状态:"恒白；无数据仅 "--" 内联灰
          {
            const std::string& pk = id(ha_parking_status).state;
            const bool has_pk = id(ha_parking_status).has_state() && !pk.empty()
                                && pk != "unknown" && pk != "unavailable";
            uint32_t pkc = 0xFFFFFF;
            if (has_pk) {
              if      (pk.find("空")     != std::string::npos) pkc = 0x59D98B;
              else if (pk.find("比亚迪") != std::string::npos) pkc = 0xFF80AB;
              else if (pk.find("轩逸")   != std::string::npos) pkc = 0xFFD54F;
              snprintf(buf, sizeof(buf), "车位状态: #%02X%02X%02X %s#",
                       (unsigned) ((pkc >> 16) & 0xFF), (unsigned) ((pkc >> 8) & 0xFF),
                       (unsigned) (pkc & 0xFF), pk.c_str());
            } else {
              snprintf(buf, sizeof(buf), "车位状态: #757575 --#");
            }
            lv_label_set_text(id(home_parking_label), buf);
            // 前缀基色恒白；状态字与 "--" 由内联 tag 着色
            lv_obj_set_style_text_color(id(home_parking_label), lv_color_hex(0xFFFFFF), 0);
            lv_obj_set_style_text_color(id(home_parking_icon),  lv_color_hex(pkc), 0);
          }

          // 车辆距离（车位卡右栏上下两行，12px，只显示"数值+km"）：
          //   黄 FFD54F = 轩逸 / 粉 FF80AB = 比亚迪，颜色即身份
          //   无数据显示灰 "--"
          auto set_dist = [](lv_obj_t* lbl, esphome::sensor::Sensor* s, uint32_t color) {
            char b[24];
            if (std::isfinite(s->state)) {
              snprintf(b, sizeof(b), "%.2fkm", s->state);
              lv_obj_set_style_text_color(lbl, lv_color_hex(color), 0);
            } else {
              snprintf(b, sizeof(b), "--");
              lv_obj_set_style_text_color(lbl, lv_color_hex(0x757575), 0);
            }
            lv_label_set_text(lbl, b);
          };
          set_dist(id(home_xuanyi_dist_label), id(ha_xuanyi_dist), 0xFFD54F);
          set_dist(id(home_byd_dist_label),    id(ha_byd_dist),    0xFF80AB);

          // ===== 行4/行5 左列：设备计数（格式：电灯: 2/36盏）=====
          auto set_cnt = [](lv_obj_t* lbl, esphome::sensor::Sensor* s, const char* name, const char* total) {
            char b[40];
            if (std::isfinite(s->state)) snprintf(b, sizeof(b), "%s: %d/%s", name, (int)s->state, total);
            else snprintf(b, sizeof(b), "%s: #757575 --#", name);
            lv_label_set_text(lbl, b);
            lv_obj_set_style_text_color(lbl, lv_color_hex(0xFFFFFF), 0);   // 名称恒白，仅 -- 内联灰
          };
          set_cnt(id(home_light_label),     id(ha_light_on),       "电灯", "36盏");
          set_cnt(id(home_curtain_label),   id(ha_curtain_closed), "窗帘", "6幅");
          set_cnt(id(home_climate_label),   id(ha_climate_on),     "空调", "4台");
          set_cnt(id(home_equipment_label), id(ha_equipment_on),   "电器", "20台");

          // ===== 中列：今日能耗（电压 / 水压 / 用气 / 用电）=====
          // 名称恒白；数值未就绪时仅 "--" 内联灰，有数据白色；单位随实体走
          auto fmt_val = [](lv_obj_t* lbl, const char* name, float v, const char* unit, int prec) {
            char out[40];
            if (!std::isfinite(v)) {
              snprintf(out, sizeof(out), "%s: #757575 --#", name);
              lv_label_set_text(lbl, out);
              lv_obj_set_style_text_color(lbl, lv_color_hex(0xFFFFFF), 0);
              return;
            }
            char num[24];
            snprintf(num, sizeof(num), prec == 0 ? "%.0f" : (prec == 2 ? "%.2f" : "%.1f"), v);
            snprintf(out, sizeof(out), "%s: %s%s", name, num, unit);
            lv_label_set_text(lbl, out);
            lv_obj_set_style_text_color(lbl, lv_color_hex(0xFFFFFF), 0);
          };
          // 用电量 sensor.tasmota_energy_today（kWh）
          fmt_val(id(home_energy_today_label), "用电", id(ha_energy_today).state, "kWh", 2);
          // 用气量 sensor.ri_yong_qi_liang（m³）
          fmt_val(id(home_gas_label), "用气", id(ha_gas_today).state, "m³", 2);
          // 电压 sensor.tasmota_energy_voltage（V）
          fmt_val(id(home_voltage_label), "电压", id(ha_voltage).state, "V", 0);
          // 水压 sensor.maze_wateronev3_tp_f8e644（bar）
          fmt_val(id(home_water_pressure_label), "水压", id(ha_water_pressure).state, "bar", 1);

          // ===== 右列：在线设备两格（通用槽位，名称由 HA 下发；图标颜色固定）=====
          // 有状态才判断在线/离线；实体缺失时显示 "--"
          auto set_dev_state = [](lv_obj_t* state_lbl, esphome::binary_sensor::BinarySensor* bs) {
            if (!bs->has_state()) {
              lv_label_set_text(state_lbl, "--");
              lv_obj_set_style_text_color(state_lbl, lv_color_hex(0x757575), 0);
              return;
            }
            lv_label_set_text(state_lbl, bs->state ? "在线" : "离线");
            lv_obj_set_style_text_color(state_lbl, lv_color_hex(bs->state ? 0x59D98B : 0x757575), 0);
          };
          set_dev_state(id(home_dev_a_state), id(ha_device_a_online));
          set_dev_state(id(home_dev_b_state), id(ha_device_b_online));
          // 名称：HA 下发优先（device_a_name / device_b_name），留空回退到「Nova13 / Nova12」
          if (id(home_dev_a_name))
            lv_label_set_text(id(home_dev_a_name),
                              id(hd_device_a_name).empty() ? "Nova13" : id(hd_device_a_name).c_str());
          if (id(home_dev_b_name))
            lv_label_set_text(id(home_dev_b_name),
                              id(hd_device_b_name).empty() ? "Nova12" : id(hd_device_b_name).c_str());
