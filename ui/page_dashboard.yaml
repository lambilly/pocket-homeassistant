# ==========================================================
# 页面 1：家居（默认首页）
#   6 个标准行，高度均分：320 - 上边距5 - 下边距5 - 5个间距×3 = 295
#   295 / 6 = 49 余 1 → 余数给首行：行1 高 50，其余 49
#   行1：中文时间 | 天气与温度 | 上证指数      （字号：small）
#   行2：服务器 / 网关 / AP / 设备 四格在线数   （字号：small）
#   行3：居家模式 | 车位状态                   （字号：medium）
#   行4：左列「电灯/窗帘」跨两行(101) | 中列「空调/电器」跨两行(101)
#        | 右列上下两个标准行：在线设备 A / 在线设备 B（通用格，名称由 HA 下发）
#   行5：（左中列已跨行占用）右列下半，行4~行5 合成一个 101 高的视觉块
#   行6：TAB 导航（家居 | 网络 | 系统）         （字号：medium）
# 依赖 ui_common.yaml 里的字体与全局变量
# ==========================================================

lvgl:
  pages:
    - id: dashboard_page
      width: 480
      height: 320
      bg_color: 0x0F0F0F
      scrollable: false
      scrollbar_mode: "OFF"
      on_load:
        - lambda: id(ui_current_page) = 0;   # 家居页 = 默认首页
        # 套用本页当前配色（HA 下拉选了非默认色时，开机/切页后仍能正确显示）
        - script.execute:
            id: ui_apply_bg
            page: 0
      widgets:
        # ============ 行1：时间 / 天气 / 上证指数 (y5 h50) ============
        - obj:
            x: 5
            y: 5
            width: 470
            height: 50
            bg_color: 0x1E1E1E
            border_width: 1
            outline_width: 0
            radius: 10
            scrollable: false
            widgets:
              - label:
                  id: home_time_label
                  align: left_mid
                  x: 3
                  text: "加载中..."
                  text_font: ui_font_medium
                  text_color: 0xFFFFFF
              - label:
                  align: left_mid
                  x: 200
                  text: "\U000F0595"
                  text_font: mdi_icons_20
                  height: 18
                  text_color: 0x4FD8FA
              - label:
                  id: home_weather_label
                  align: left_mid
                  x: 222
                  text: "--"
                  text_font: ui_font_medium
                  text_color: 0x757575
                  recolor: true
              - label:
                  id: home_stock_icon
                  align: left_mid
                  x: 315
                  text: "\U000F012A"
                  text_font: mdi_icons_20
                  height: 18
                  text_color: 0x757575
              # “上证:”前缀（颜色由 lambda 随涨跌同步）
              - label:
                  id: home_stock_prefix
                  align: left_mid
                  x: 337
                  text: "上证:"
                  text_font: ui_font_medium
                  text_color: 0x757575
              - label:
                  id: home_stock_label
                  align: left_mid
                  x: 377
                  text: "--"
                  text_font: ui_font_medium
                  text_color: 0x757575

        # ============ 行2：四格设备在线数 (y58 h49) ============
        - obj:
            x: 5
            y: 61
            width: 105
            height: 41
            bg_color: 0x1E1E1E
            border_width: 1
            outline_width: 0
            radius: 10
            scrollable: false
            widgets:
              - label:
                  id: home_server_icon
                  align: left_mid
                  x: -2
                  text: "\U000F0826"
                  text_font: mdi_icons_20
                  height: 18
                  text_color: 0xFFB74D
              - label:
                  id: home_server_label
                  align: left_mid
                  x: 18
                  text: "在家: #757575 --#"
                  text_font: ui_font_medium
                  text_color: 0xFFFFFF
                  recolor: true
        - obj:
            x: 126
            y: 61
            width: 105
            height: 41
            bg_color: 0x1E1E1E
            border_width: 1
            outline_width: 0
            radius: 10
            scrollable: false
            widgets:
              - label:
                  id: home_gateway_icon
                  align: left_mid
                  x: -2
                  text: "\U000F0010"
                  text_font: mdi_icons_20
                  height: 18
                  text_color: 0xB39DFF
              - label:
                  id: home_gateway_label
                  align: left_mid
                  x: 18
                  text: "客人: #757575 --#"
                  text_font: ui_font_medium
                  text_color: 0xFFFFFF
                  recolor: true
        - obj:
            x: 249
            y: 61
            width: 105
            height: 41
