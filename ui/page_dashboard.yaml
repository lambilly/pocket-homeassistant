        # ============ 行4~行5 右侧下格：在线设备 B (y214 h49) ============
        # 通用格：名称由 HA 下发（device_b_name），留空显示「Nova12」；超长截断
        # 图标固定紫色；名称与状态同一行（名称左、状态右），在线绿/离线灰
        - obj:
