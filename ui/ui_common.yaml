globals:
  - id: ui_touch_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: lvgl_ready
    type: bool
    restore_value: false
    initial_value: "false"
  - id: ui_display_temperature
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: ui_state_code
    type: uint8_t
    restore_value: false
    initial_value: "5"
  - id: ui_accent_code
    type: uint8_t
    restore_value: false
    initial_value: "2"
  - id: ui_current_page
    type: uint8_t
    restore_value: false
    initial_value: "0"
  # --- 屏幕休眠管理 ---
  - id: ui_auto_sleep_enabled
    type: bool
    restore_value: true
    initial_value: "true"
  - id: ui_screen_off
    type: bool
    restore_value: false
    initial_value: "false"
  # 唤醒保持期截止时刻（millis 基准，0 = 无保持）。
  #   熄屏巡检依赖 LVGL 的「无输入时间」，而亮屏本身不是输入事件——
  #   通知唤醒时该值往往早已超过熄屏阈值，1s 巡检会立刻把屏又关掉，
  #   表现为「通知来了闪一下就熄」。wake_screen 里写这里来跳过巡检。
  - id: ui_hold_until
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # 默认亮度 60%（v1.1.1 续航优化）：开机点亮与熄屏恢复都取此值；
  # 用户在系统页滑块或 HA 灯实体上调过亮度后，熄屏恢复仍按用户值。
  - id: ui_saved_brightness
    type: float
    restore_value: false
    initial_value: "0.6"
  # --- 每页卡片底色（v1.1.0，HA 下拉选色）---
  #   卡片底色 = 该值；screen 四周 5px 边距与卡间 3px 缝隙 = 该值 × 0.5
  #   默认 0x1E1E1E（石墨档）与改造前观感一致；八档可选：
  #   深红 831C0C / 深黄 866603 / 墨绿 0E3A20 / 浅蓝 017989 / 深蓝 14285A / 深紫 32174D / 深靛 241A48
  - id: ui_bg_dash
    type: uint32_t
    restore_value: true
    initial_value: "0x1E1E1E"
  - id: ui_bg_net
    type: uint32_t
    restore_value: true
    initial_value: "0x1E1E1E"
  - id: ui_bg_sys
    type: uint32_t
    restore_value: true
    initial_value: "0x1E1E1E"
# 时钟刷新（概览页行1 的时间标签）
#   这里统一改写到概览页的 home_time_label，避免引用不存在的 id。
#   优先用 HA 推送的中文时间实体（ha_time_text），取不到时用本机 SNTP 时间兜底。
#   SNTP 只要设备能上网就能对时，不依赖 HA 是否可达。
interval:
  # ----------------------------------------------------------
  # 数据通道状态巡检（1 秒一次）
  #   判定：超过 ha_stale_ms（15s）没收到新的 MQTT 数据帧 → 离线
  #   开机后前 20 秒不显示离线（等 WiFi + MQTT + 首帧数据到位），
  #   避免开机瞬间闪一下红字。
  # ----------------------------------------------------------
  - interval: 1s
    then:
      - lambda: |-
          if (!id(lvgl_ready)) return;

          const uint32_t now_ms = millis();
          const uint32_t last   = id(ha_data_last_ms);

          // 开机保护期：2 秒到 20 秒之间不报离线
          if (now_ms < 20000) {
            lv_obj_add_flag(id(offlink_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(offlink_text), LV_OBJ_FLAG_HIDDEN);
            return;
          }

          const bool stale = (last == 0) || (now_ms - last > id(ha_stale_ms));
          static bool shown = false;
          if (stale != shown) {
            shown = stale;
            if (stale) {
              lv_obj_clear_flag(id(offlink_icon), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(offlink_text), LV_OBJ_FLAG_HIDDEN);
              ESP_LOGW("offlink", "数据通道离线（最后更新 %u ms 前）",
                       (unsigned)(last == 0 ? 0 : now_ms - last));
            } else {
              lv_obj_add_flag(id(offlink_icon), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(offlink_text), LV_OBJ_FLAG_HIDDEN);
              ESP_LOGI("offlink", "数据通道恢复");
            }
          }

  - interval: 1s
    then:
      - lambda: |-
          if (!id(lvgl_ready)) return;
          if (id(ui_current_page) != 0) return;
          if (id(ha_time_text).has_state() && !id(ha_time_text).state.empty()) return;

          auto now = id(system_time).now();
          if (now.is_valid()) {
            char tbuf[48];
            static const char* wk[] = {"日", "一", "二", "三", "四", "五", "六"};
            int w = now.day_of_week - 1;
            if (w < 0 || w > 6) w = 0;
            snprintf(tbuf, sizeof(tbuf), "%d月%d日 星期%s %02d:%02d",
                     now.month, now.day_of_month, wk[w], now.hour, now.minute);
            lv_label_set_text(id(home_time_label), tbuf);
          }

  # 启动后做一次字库自检：日志里打印 ok 表示该字已编译进字体，MISS 表示缺失
  - interval: 15s
    then:
      - lambda: |-
          static bool checked = false;
          if (checked || !id(lvgl_ready)) return;
          checked = true;
          const lv_font_t *f = lv_obj_get_style_text_font(id(home_time_label), LV_PART_MAIN);
          if (f == nullptr) {
            ESP_LOGW("font", "home_time_label font is null");
            return;
          }
          static const uint32_t cps[] = {
            0x6982, 0x89C8, 0x7F51, 0x7EDC, 0x7CFB, 0x7EDF,
            0x670D, 0x52A1, 0x5668, 0x8BBE, 0x5907, 0x7535,
          };
          for (uint32_t cp : cps) {
            lv_font_glyph_dsc_t dsc;
            bool ok = lv_font_get_glyph_dsc(f, &dsc, cp, 0);
            ESP_LOGI("font", "U+%04lX %s", (unsigned long) cp, ok ? "ok" : "MISS");
          }

  # ============================================================
  # 熄屏巡检：每秒判断是否该关闭背光
  #   · 空闲时长取 LVGL 的"无输入时间"（触摸最后活动至今），
  #     比手写 millis() 更准，也不用自己维护计时变量；
  #   · 阈值来自 HA 可调的 number 实体 sleep_timeout_number（默认 60s）；
  #   · 只关背光，不暂停 LVGL —— 唤醒时画面立刻就在，不会卡一下。
  #   函数名用 lv_disp_get_inactive_time：与 ESPHome 内置 lvgl 的
  #   lvgl.is_idle 条件实现完全一致（源码 automation.py 里就是
  #   lv_expr.disp_get_inactive_time(...)）。
  # ============================================================
  - interval: 1s
    then:
      - lambda: |-
          if (!id(lvgl_ready)) return;
          if (id(ui_screen_off)) return;
          if (!id(ui_auto_sleep_enabled)) return;

          // 唤醒保持期内不熄屏（有符号差值比较，millis() 回绕也正确）
          if (id(ui_hold_until) != 0 && (int32_t) (millis() - id(ui_hold_until)) < 0) return;

          uint32_t idle_ms = lv_disp_get_inactive_time(NULL);
          uint32_t sleep_ms = (uint32_t) (id(sleep_timeout_number).state * 1000.0f);
          if (idle_ms >= sleep_ms) {
            id(sleep_screen).execute();
          }

  # ============================================================
  # TAB 当前页高亮（v2.0）
  #   ui/tab_bar.yaml 是四页共用的导航片段，不带 id（否则四次 include
  #   会重复定义）。这里按 ui_current_page 找到底部那张 h49 的卡片，
  #   把第 idx 个子标签刷成青色 4FD8FA，其余刷灰 757575。
  #   ui_current_page 编码：0 家居 / 2 网络 / 3 系统 / 4 通知（1 弃用）
  # ============================================================
  - interval: 200ms
    then:
      - lambda: |-
          if (!id(lvgl_ready)) return;
          static int last_page = -1;
          const int p = id(ui_current_page);
          if (p == last_page) return;
          last_page = p;
          id(ui_tab_highlight).execute();

script:
  - id: ui_tab_highlight
    mode: restart
    then:
      - lambda: |-
          const int p = id(ui_current_page);
          const int idx = (p == 0) ? 0 : (p == 2) ? 1 : (p == 3) ? 2 : (p == 4) ? 3 : -1;
          if (idx < 0) return;

          // LVGL 9 把 lv_scr_act 改成 lv_screen_active，这里两版都兼容
          #if LVGL_VERSION_MAJOR >= 9
          lv_obj_t *scr = lv_screen_active();
          #else
          lv_obj_t *scr = lv_scr_act();
          #endif
          if (scr == nullptr) return;
          const uint32_t n = lv_obj_get_child_count(scr);
          for (uint32_t i = 0; i < n; i++) {
            lv_obj_t *card = lv_obj_get_child(scr, i);
            if (card == nullptr) continue;
            if (lv_obj_get_height(card) != 49) continue;    // TAB 卡片高度
            if (lv_obj_get_y(card) < 260) continue;         // 且必须贴着底部
            for (uint32_t j = 0; j < 4 && j < lv_obj_get_child_count(card); j++) {
              lv_obj_t *lb = lv_obj_get_child(card, j);
              if (lb == nullptr) continue;
              lv_obj_set_style_text_color(lb, lv_color_hex(j == (uint32_t) idx ? 0x4FD8FA : 0x757575), 0);
            }
            return;
          }
