  pages:
    - id: network_page
      width: 480
      height: 320
      bg_color: 0x0F0F0F
      scrollable: false
      scrollbar_mode: "OFF"
      on_load:
        - lambda: id(ui_current_page) = 2;   # 网络页
        # 套用本页当前配色（HA 下拉选了非默认色时，开机/切页后仍能正确显示）
        - script.execute:
            id: ui_apply_bg
            page: 1
      widgets:
        # ============ 行1：外网 IP / 已连接时长 (y5 h50) ============
