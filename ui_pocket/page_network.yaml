# ==========================================================
# 页面 2：网络
#   行高与 page_dashboard.yaml 完全对齐：
#     行1 y5   h50  （与家居页行1 一致）
#     行2 y58  h49  （与家居页行2 一致，由 4 格改为 5 格均分）
#     行3 y110 h153 （剩余空间全部给第三行，三列均分）
#     行4 y266 h49  （与家居页末行一致）
#   行1：外网 IP / 已连接时长（WAN）
#   行2：服务器 / 网关 / AP / 设备 / ASR  五列均分
#   行3：网络运行 | NAS运行 | 风扇运行   三列均分（标题 + 下划线 + 四行）
#   行4：TAB 导航（家居 | 网络 | 系统）
#
# 依赖 ui_common.yaml 里的字体与全局变量
# ==========================================================

