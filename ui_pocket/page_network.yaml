            x: 5
            y: 5
            width: 470
            height: 50
            bg_color: 0x1E1E1E
            border_width: 1
            outline_width: 0
            radius: 10
            scrollable: false
            widgets:
              # 行1 左块整体左移 3px（10-31 二十一轮）：图标 x4→1、文字 x26→23
              #   目的：首元素视觉左边界与第一页行1 的时间文字对齐
