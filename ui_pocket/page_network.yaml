                  align: left_mid
                  x: 1
                  text: "\U000F0A5F"
                  text_font: mdi_icons_20
                  height: 18
                  text_color: 0x4FC3F7
              - label:
                  id: net_ip_label
                  align: left_mid
                  x: 23
                  text: "外网IP: #757575 --#"
                  text_font: ui_font_medium
                  text_color: 0xFFFFFF
                  recolor: true
              - label:
                  align: left_mid
                  x: 277
                  text: "\U000F0FA8"
                  text_font: mdi_icons_20
                  height: 18
                  text_color: 0x59D98B
              - label:
