        # ============ 底部四键 TAB（四页共用，见 ui_pocket/tab_bar.yaml） ============
        - !include tab_bar.yaml

# ==========================================================
# 本页数据刷新
#   只在网络页可见时刷新（ui_current_page == 2）省 CPU
# ==========================================================
interval:
  - interval: 2s
    then:
      - lambda: |-
          if (!id(lvgl_ready)) return;
          if (id(ui_screen_off)) return;      // 熄屏时不再刷控件，省 CPU/SPI
          if (id(ui_current_page) != 2) return;

          char buf[64];

          // ===== 行1：外网 IP / 已连接时长 =====
          {
            std::string ip = id(net_external_ip).state;
            if (ip.empty()) snprintf(buf, sizeof(buf), "外网IP: #757575 --#");
            else snprintf(buf, sizeof(buf), "外网IP: %s", ip.c_str());
            lv_label_set_text(id(net_ip_label), buf);
            // 名称恒白；无 IP 数据时仅 "--" 内联灰
            lv_obj_set_style_text_color(id(net_ip_label), lv_color_hex(0xFFFFFF), 0);
          }
          {
            // WAN 状态：名称恒白；离线整行灰（断网提示）；无数据（--）仅值内联灰
            const bool wan_known = id(net_wan_status).has_state();
            const bool wan_up    = wan_known && id(net_wan_status).state;
            lv_obj_set_style_text_color(id(net_uptime_label),
                                        lv_color_hex((wan_known && !wan_up) ? 0x757575 : 0xFFFFFF), 0);

            // 已连接时长：sensor.tp_link_smb_tl_r498gpm_ac_uptime（单位秒）
            float secs = id(net_wan_uptime).state;
            if (!wan_known) {
              lv_label_set_text(id(net_uptime_label), "已连接: #757575 --#");
            } else if (!wan_up) {
              lv_label_set_text(id(net_uptime_label), "已连接: 离线");
            } else if (!std::isfinite(secs) || secs < 0) {
              lv_label_set_text(id(net_uptime_label), "已连接: #757575 --#");
            } else {
              // 单位自适应：<1小时显示分钟，<1天显示小时，否则 天+小时
              int total = (int) secs;
              if (total < 3600) {
                snprintf(buf, sizeof(buf), "已连接: %d分钟", total / 60);
              } else if (total < 86400) {
                snprintf(buf, sizeof(buf), "已连接: %d小时%d分", total / 3600, (total % 3600) / 60);
              } else {
                snprintf(buf, sizeof(buf), "已连接: %d天%d小时", total / 86400, (total % 86400) / 3600);
              }
              lv_label_set_text(id(net_uptime_label), buf);
            }
          }

          // ===== 行2：五列在线数（图标+文字整格同步着色）=====
          //   >0 → 各格固定色（主机红/网关紫/无线橙/设备蓝/语音绿）
          //   =0 → 红 FF5252（离线告警）
          //   --  → 灰 757575（无数据不算离线）
          auto set_cnt = [](lv_obj_t* lbl, lv_obj_t* icon, esphome::sensor::Sensor* s,
                            const char* name, uint32_t on_color) {
            char b[40];
            const bool has = std::isfinite(s->state);
            if (!has) snprintf(b, sizeof(b), "%s: --", name);
            else snprintf(b, sizeof(b), "%s: %d", name, (int) s->state);
            lv_label_set_text(lbl, b);
            const uint32_t c = !has ? 0x757575 : (s->state > 0.0f ? on_color : 0xFF5252);
            lv_obj_set_style_text_color(lbl,  lv_color_hex(c), 0);
            lv_obj_set_style_text_color(icon, lv_color_hex(c), 0);
          };
          set_cnt(id(net_server_label),  id(net_server_icon),  id(ha_server_count),  "主机", 0xFF5252);
          set_cnt(id(net_gateway_label), id(net_gateway_icon), id(ha_gateway_count), "网关", 0xB39DFF);
          set_cnt(id(net_ap_label),      id(net_ap_icon),      id(ha_ap_count),      "无线", 0xFFB74D);
          set_cnt(id(net_monitor_label), id(net_monitor_icon), id(ha_monitor_count), "设备", 0x5AA9FF);
          set_cnt(id(net_asr_label),     id(net_asr_icon),     id(ha_asr_count),     "语音", 0x59D98B);

          // ===== 行3 左列：网络总览 =====
          // 行2 那组（主机/网关/无线/设备/语音）是"数字本身即答案"，不加单位；
          // 这里四个是"在线几台/几个"，带单位更符合中文表达。
          auto set_cnt_u = [](lv_obj_t* lbl, esphome::sensor::Sensor* s,
                              const char* name, const char* unit) {
            char b[40];
            if (std::isfinite(s->state)) snprintf(b, sizeof(b), "%s: %d%s", name, (int) s->state, unit);
            else snprintf(b, sizeof(b), "%s: #757575 --#", name);
            lv_label_set_text(lbl, b);
            lv_obj_set_style_text_color(lbl, lv_color_hex(0xFFFFFF), 0);   // 名称恒白，仅 -- 内联灰
          };
          set_cnt_u(id(net_router_label),   id(ha_router_count),   "路由在线", "台");
          set_cnt_u(id(net_ctrl_label),     id(ha_device_ctrl),    "控制设备", "个");
          set_cnt_u(id(net_terminal_label), id(ha_terminal_count), "终端在线", "个");

          // 低电量数：整行恒蓝（与图标一致）；有低电量(>0)时“只把数量数字标红”，
          // 其余文字与图标保持蓝色；=0 全蓝；-- 灰
          {
            float v = id(ha_low_battery).state;
            if (std::isfinite(v)) {
              if (v > 0.0f) snprintf(buf, sizeof(buf), "低电量数: #FF5252 %d个#", (int) v);
              else          snprintf(buf, sizeof(buf), "低电量数: %d个", (int) v);
            } else {
              snprintf(buf, sizeof(buf), "低电量数: #757575 --#");
            }
            lv_label_set_text(id(net_battery_label), buf);
            lv_obj_set_style_text_color(id(net_battery_label), lv_color_hex(0xFFFFFF), 0);
          }

          // ===== 行3 中列：NAS运行（CPU / 内存 / 上传 / 下载）=====
          // CPU / 内存：百分比，超阈值变色提示
          //   base_color 是常态色（与同行的图标颜色一致）。CPU 常态橙、超限黄/红；
          //   内存常态色就是紫色（和图标一样），但超限时仍然变成黄/红，避免"满了还显示紫色"的误判。
          //   未载入数据（首帧/实体缺失）→ 名称保持基色白，仅 "--" 内联灰。
          auto set_pct = [](lv_obj_t* lbl, esphome::sensor::Sensor* s, const char* name,
                            uint32_t warn, uint32_t danger, uint32_t base_color) {
            char b[40];
            if (!std::isfinite(s->state)) {
              snprintf(b, sizeof(b), "%s: #757575 --#", name);
              lv_label_set_text(lbl, b);
              lv_obj_set_style_text_color(lbl, lv_color_hex(base_color), 0);
              return;
            }
            int v = (int) s->state;
            snprintf(b, sizeof(b), "%s: %d%%", name, v);
            lv_label_set_text(lbl, b);
            lv_obj_set_style_text_color(
                lbl, lv_color_hex(v >= (int) danger ? 0xFF5252 : (v >= (int) warn ? 0xFFD54F : base_color)), 0);
          };
          set_pct(id(net_nas_cpu_label), id(ha_nas_cpu), "CPU利用", 70, 90, 0xFFFFFF);
          set_pct(id(net_nas_mem_label), id(ha_nas_mem), "内存可用", 75, 92, 0xFFFFFF);

          // 网速（实体单位通常为 B/s，自适应 KB/s、MB/s）；上传/下载共用
          auto set_rate = [](lv_obj_t* lbl, esphome::sensor::Sensor* s, const char* name) {
            char b[40];
            float v = s->state;
            if (!std::isfinite(v) || v < 0) {
              snprintf(b, sizeof(b), "%s: #757575 --#", name);
            } else if (v < 1024.0f) {
              snprintf(b, sizeof(b), "%s: %d B/s", name, (int) v);
            } else if (v < 1024.0f * 1024.0f) {
              snprintf(b, sizeof(b), "%s: %.1f KB/s", name, v / 1024.0f);
            } else {
              snprintf(b, sizeof(b), "%s: %.2f MB/s", name, v / 1048576.0f);
            }
            lv_label_set_text(lbl, b);
            // 名称恒白；无数据仅 "--" 内联灰
            lv_obj_set_style_text_color(lbl, lv_color_hex(0xFFFFFF), 0);
          };
          set_rate(id(net_nas_upload_label),   id(ha_nas_upload),   "上传");
          set_rate(id(net_nas_download_label), id(ha_nas_download), "下载");

          // ===== 行3 右列：风扇四路 =====
          // 着色规则（"前扇:"等前缀恒用本行图标色，只有后面的状态字变色）：
          //   停 / 关 / --(无数据) → 灰 757575
          //   开、转速 ≤50%       → 黄 FFD54F（正常运转）
          //   转速 51~80%         → 橙 FFB74D（高负载）
          //   转速 >80%           → 红 FF5252（极高负载）
          auto set_fan = [](lv_obj_t* lbl, esphome::sensor::Sensor* rpm_s,
                            esphome::sensor::Sensor* pct_s, const char* name, uint32_t base) {
            char b[48];
            const float rpm = rpm_s->state;
            const float pct = pct_s->state;
            if (!std::isfinite(rpm)) {
              snprintf(b, sizeof(b), "%s: #757575 --#", name);
            } else if (rpm < 1.0f) {
              snprintf(b, sizeof(b), "%s: #757575 停#", name);
            } else if (std::isfinite(pct)) {
              const char* c = pct > 80.0f ? "FF5252" : (pct > 50.0f ? "FFB74D" : "FFD54F");
              snprintf(b, sizeof(b), "%s: #%s %d%%#", name, c, (int) pct);
            } else {
              snprintf(b, sizeof(b), "%s: #FFD54F %d转#", name, (int) rpm);
            }
            lv_label_set_text(lbl, b);
            lv_obj_set_style_text_color(lbl, lv_color_hex(base), 0);
          };
          set_fan(id(net_fan_front_label), id(ha_fan1_rpm), id(ha_fan1_speed), "前扇", 0xFFFFFF);
          set_fan(id(net_fan_back_label),  id(ha_fan2_rpm), id(ha_fan2_speed), "后扇", 0xFFFFFF);
          // 进扇/出扇是 Sonoff 开关（switch 域），只表示开/关，没有转速
          auto set_sw_fan = [](lv_obj_t* lbl, esphome::binary_sensor::BinarySensor* bs,
                               const char* name, uint32_t base) {
            char b[48];
            if (!bs->has_state()) {           // 实体缺失/无数据，显式提示便于排查
              snprintf(b, sizeof(b), "%s: #757575 --#", name);
            } else {
              snprintf(b, sizeof(b), "%s: #%s %s#", name,
                       bs->state ? "FFD54F" : "757575", bs->state ? "开" : "关");
            }
            lv_label_set_text(lbl, b);
            lv_obj_set_style_text_color(lbl, lv_color_hex(base), 0);
          };
          set_sw_fan(id(net_fan_in_label),  id(ha_fan_in_switch),  "进扇", 0xFFFFFF);
          set_sw_fan(id(net_fan_out_label), id(ha_fan_out_switch), "出扇", 0xFFFFFF);

          // 四路温度：紧跟风扇状态后面（温度计图标固定色，数值统一浅灰）
          auto set_temp = [](lv_obj_t* lbl, esphome::sensor::Sensor* s) {
            char b[24];
            if (!std::isfinite(s->state)) snprintf(b, sizeof(b), "--");
            else snprintf(b, sizeof(b), "%.0f℃", s->state);
            lv_label_set_text(lbl, b);
            // -- 灰 / 有数据白
            lv_obj_set_style_text_color(lbl, lv_color_hex(std::isfinite(s->state) ? 0xFFFFFF : 0x757575), 0);
          };
          set_temp(id(net_temp_front_label), id(ha_temp_front));
          set_temp(id(net_temp_back_label),  id(ha_temp_back));
          set_temp(id(net_temp_in_label),    id(ha_temp_in));
          set_temp(id(net_temp_out_label),   id(ha_temp_out));
