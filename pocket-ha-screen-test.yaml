##############################################################################
# Pocket HomeAssistant — 阶段一：点亮屏幕（可直接在 HA 的 ESPHome 里编译）
#
# 用法：
#   1. 本文件放到 ESPHome 配置目录（HA 里是 /config/esphome/，即 W:\esphome\）
#   2. 同目录下要有 fonts/NotoSansSC-SemiBold.ttf（原项目 W:\esphome\fonts 已有）
#   3. ESPHome 里打开本文件 → Install → 首次走 USB（Plug into this computer）
#   4. 烧完若黑屏：拔掉 USB 重新插一次（屏复位接的是 EN，必须断电重启）
#
# 前提：ESPHome 版本需 ≥ 2025.2（mipi_spi 组件 + CUSTOM 模型），框架必须 ESP-IDF
# 板卡：LCDWIKI ES3C35P（ESP32-S3 N16R8，3.5" 320x480，ST77922 QSPI）
# 目的：只验证四件事 —— 显示驱动能起来、方向正确、颜色不乱、背光可控
# 触摸（ST77922 内置，I2C 0x55）本阶段不接
#
# 引脚（官方 wiki「ESP32-S3 pin allocation」）：
#   LCD  CS=IO10  CLK=IO12  D0=IO11  D1=IO13  D2=IO14  D3=IO9
#   LCD  RST = EN（与主控复位共用，无独立 GPIO）
#   LCD  BL  = IO41
# 驱动：mipi_spi，四线 QSPI，初始化序列取自 ESPHome dev 分支 ES3C35P 模型
##############################################################################

esphome:
  name: pocket-ha-test
  friendly_name: Pocket HA Test
  on_boot:
    priority: 700
    then:
      - output.set_level:
          id: bkl
          level: 85%

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

# 背光：IO41，PWM 调光
output:
  - platform: ledc
    id: bkl
    pin: GPIO41
    frequency: 2000Hz

# 四线 QSPI 总线：CLK + D0~D3
spi:
  id: lcd_qspi
  type: quad
  clk_pin: GPIO12
  data_pins:
    - GPIO11   # D0 (MOSI)
    - GPIO13   # D1 (MISO)
    - GPIO14   # D2
    - GPIO9    # D3

font:
  - file: "fonts/NotoSansSC-SemiBold.ttf"
    id: f24
    size: 24
    glyphs: "PocketHA STQI0123456789xX:Y"

display:
  - platform: mipi_spi
    id: lcd
    model: CUSTOM
    bus_mode: quad
    cs_pin: GPIO10
    dimensions: 320x480
    rotation: 90°             # 壳内横装：画布变 480x320（若内容上下颠倒，改成 270°）
    transform: disabled       # ST77922 不支持硬件行列交换，禁用硬件变换、强制软件旋转
    data_rate: 40MHz
    draw_rounding: 4          # ST77922 要求 x 坐标 4 像素对齐，否则花屏
    color_order: rgb          # 面板实际顺序 RGB（官方示例：RGB order + inversion on）
    invert_colors: true
    update_interval: 10s
    init_sequence:
      # 软复位 + 120ms：屏 RESET 接在 EN 上，OTA/软件重启后需靠软复位唤醒（ST77922 要求 120ms）
      - [0x01]
      - delay 120ms
      - [0x01]
      - delay 120ms
      - [0xF1, 0x00]
      - [0x60, 0x00, 0x00, 0x00]
      - [0x65, 0x80]
      - [0x79, 0x06]
      - [0x7B, 0x00, 0x08, 0x08]
      - [0x80, 0x55, 0x62, 0x2F, 0x17, 0xF0, 0x52, 0x70, 0xD2, 0x52, 0x62, 0xEA]
      - [0x81, 0x26, 0x52, 0x72, 0x27]
      - [0x84, 0x92, 0x25]
      - [0x87, 0x10, 0x10, 0x58, 0x00, 0x02, 0x3A]
      - [0x88, 0x00, 0x00, 0x2C, 0x10, 0x04, 0x00, 0x00, 0x00, 0x01, 0x01, 0x01, 0x01, 0x01, 0x00, 0x06]
      - [0x89, 0x00, 0x00, 0x00]
      - [0x8A, 0x13, 0x00, 0x2C, 0x00, 0x00, 0x2C, 0x10, 0x10, 0x00, 0x3E, 0x19]
      - [0x8B, 0x15, 0xB1, 0xB1, 0x44, 0x96, 0x2C, 0x10, 0x97, 0x8E]
      - [0x8C, 0x1D, 0xB1, 0xB1, 0x44, 0x96, 0x2C, 0x10, 0x50, 0x0F, 0x01, 0xC5, 0x12, 0x09]
      - [0x8D, 0x0C]
      - [0x8E, 0x33, 0x01, 0x0C, 0x13, 0x01, 0x01]
      - [0xB3, 0x00, 0x30]
      - [0x71, 0xD0]
      - [0x66, 0x02, 0x3F]
      - [0xBE, 0x26, 0x00, 0x9D]
      - [0x70, 0x01, 0xA6, 0x11, 0x40, 0xE0, 0x00, 0x11, 0x60, 0x11, 0x00, 0x00, 0x1A]
      - [0x90, 0x04, 0x04, 0x55, 0x74, 0x00, 0x40, 0x43, 0x2D, 0x2D]
      - [0x91, 0x04, 0x04, 0x55, 0x75, 0x00, 0x40, 0x42, 0x2D, 0x2D]
      - [0x92, 0x04, 0x44, 0x55, 0xC0, 0x06, 0x00, 0x07, 0x05, 0x90, 0x2D]
      - [0x93, 0x04, 0x43, 0x11, 0x00, 0x00, 0x00, 0x00, 0x05, 0x90, 0x2D]
      - [0x94, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0x95, 0x96, 0x16, 0x00, 0x00, 0xFF]
      - [0x96, 0x44, 0x53, 0x03, 0x12, 0x23, 0x24, 0x06, 0x05, 0x9A, 0x2D, 0x00, 0x44]
      - [0x97, 0x44, 0x53, 0x47, 0x56, 0x20, 0x20, 0x02, 0x01, 0x9A, 0x2D, 0x00, 0x44]
      - [0xBA, 0x55, 0x9A, 0x2D, 0x9A, 0x2D]
      - [0x9A, 0x40, 0x00, 0x06, 0x00, 0x00, 0x00, 0x00]
      - [0x9B, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x00]
      - [0x9C, 0x5C, 0x12, 0x00, 0x00, 0x10, 0x12, 0x00, 0x00, 0x10, 0x02, 0x00, 0x00, 0x00]
      - [0x9D, 0x8A, 0x51, 0x00, 0x00, 0x00, 0x80, 0x1E, 0x01]
      - [0x9E, 0x51, 0x00, 0x00, 0x00, 0x80, 0x1E, 0x01]
      - [0xB4, 0x1D, 0x1C, 0x1E, 0x0B, 0x14, 0x02, 0x13, 0x09, 0x1E, 0x00, 0x1E, 0x10]
      - [0xB5, 0x1D, 0x1C, 0x1E, 0x0A, 0x15, 0x03, 0x11, 0x08, 0x1E, 0x01, 0x1E, 0x12]
      - [0xB6, 0x77, 0x77, 0x00, 0x0A, 0xFF, 0x0A, 0xFF]
      - [0x86, 0xC6, 0x04, 0xB1, 0x02, 0x58, 0x12, 0x58, 0x0C, 0x13, 0x01, 0xA5, 0x00, 0xA5, 0xA5]
      - [0xB7, 0x07, 0x0A, 0x0E, 0x06, 0x05, 0x03, 0x2B, 0x03, 0x03, 0x42, 0x07, 0x10, 0x10, 0x2E, 0x3F, 0x0D]
      - [0xB8, 0x07, 0x0A, 0x0D, 0x05, 0x05, 0x02, 0x2B, 0x02, 0x03, 0x42, 0x06, 0x10, 0x0F, 0x2E, 0x3F, 0x0D]
      - [0xB9, 0x23, 0x23]
      - [0xBF, 0x10, 0x14, 0x14, 0x0B, 0x0B, 0x0B]
      - [0xF2, 0x00]
      - [0x73, 0x04, 0xDA, 0x12, 0x54, 0x47]
      - [0x77, 0x6B, 0x5B, 0xFD, 0xC3, 0xC5]
      - [0x7A, 0x15, 0x27]
      - [0x7B, 0x04, 0x57]
      - [0x7E, 0x01, 0x0E]
      - [0xBF, 0x36]
      - [0xE3, 0x40, 0x40]
      - [0xF0, 0x00]
      - [0xD0, 0x00]
      - [0x11]              # SLPOUT
      - delay 120ms         # 面板唤醒后必须等 120ms
    lambda: |-
      // rotation: 90 后画布为横屏 480x320
      const int W = 480, H = 320;
      it.fill(Color(0, 0, 0));

      // 四条主色带（竖条从左到右）：红 / 绿 / 蓝 / 白（判断颜色顺序与反色是否正常）
      it.filled_rectangle(0,   0, 120, H, Color(255, 0, 0));
      it.filled_rectangle(120, 0, 120, H, Color(0, 255, 0));
      it.filled_rectangle(240, 0, 120, H, Color(0, 0, 255));
      it.filled_rectangle(360, 0, 120, H, Color(255, 255, 255));

      // 右半区网格：每 40px 一条灰线（判断 4 像素对齐有无花屏、有无列错位）
      for (int y = 0; y < H; y += 40)
        it.line(0, y, W - 1, y, Color(60, 60, 60));
      for (int x = 0; x < W; x += 40)
        it.line(x, 0, x, H - 1, Color(60, 60, 60));

      // 方向标记：左上黄角 + 右上青角（方向正了才对）
      it.filled_rectangle(0, 0, 8, 120, Color(255, 255, 0));
      it.filled_rectangle(0, 0, 120, 8, Color(255, 255, 0));
      it.filled_rectangle(W - 8, 0, 8, 120, Color(0, 255, 255));
      it.filled_rectangle(W - 120, 0, 120, 8, Color(0, 255, 255));

      // 文字：确认横屏方向与字库
      it.printf(16,  20, id(f24), Color(255, 255, 0),   "Pocket HA");
      it.printf(16,  56, id(f24), Color(255, 255, 255), "ST77922 QSPI");
      it.printf(16,  92, id(f24), Color(255, 255, 255), "480x320");
      it.printf(16, 128, id(f24), Color(0, 255, 255),   "X:479 Y:319");
