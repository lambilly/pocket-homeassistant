# ==========================================================
# 版本：v2.2.0 AUDIO（2026-11-07）
#   新增声音输出：MAX98357A I2S 数字功放 + 4Ω 3W 喇叭
#     · speaker(i2s_audio) → mixer → media_player(speaker)
#     · 双 pipeline（media + announcement），FLAC 由 HA 转码
#     · 内置音效 sounds/ding|notify|alarm.wav（48k/mono/16bit）
#     · SD 脚 GPIO21 空闲 3s 自动关功放（待机 <1µA）
#   上一版：v2.1 远程控制通道（HA 侧 monitor_display_control.yaml）
#   上一定版：v1.1.1（2026-11-01，续航优化，已出包）
# ==========================================================
# 主配置：设备 / 网络 / 硬件 / HA 实体
# 页面布局拆分到 ui/ 目录，改界面只需改对应文件：
#   ui/ui_common.yaml     公共资源（字体、全局变量、时钟刷新）
#   ui/page_dashboard.yaml       页面1 家居
#   ui/page_network.yaml         页面2 网络
#   ui/page_system.yaml          页面3 系统
#
# 接入方式（方案C，双通道并存）：
#   api  : 本地局域网走 ESPHome Native API（连 Home Assistant，低延迟）
#   mqtt : 外网走 MQTT/TLS（8883），脱离 HA 也能远程读取/控制
# ==========================================================

packages:
  # 页面顺序 = LVGL 页面列表顺序，第一个为开机默认页（家居）
  page_dashboard: !include ui/page_dashboard.yaml
  page_network: !include ui/page_network.yaml
  page_system: !include ui/page_system.yaml
  page_notify: !include ui/page_notify.yaml      # v2.0 NOTIFY：第四页，不参与开机默认
  ui_common: !include ui/ui_common.yaml
esphome:
  name: ha-monitor-display
  friendly_name: HA Monitor Display
  # v2.0 NOTIFY：通知环形缓冲与截断逻辑（8 槽，见 include/notify_store.h）
  includes:
    - include/notify_store.h
    - include/notify_charset.h      # notify_store.h 里 #include "notify_charset.h"，
                               # 必须一并登记，否则构建目录 src/ui/ 下没有这个文件

  # v2.1 远程控制通道：开机等 WiFi/MQTT 连上后回发一次状态帧，
  #   让 HA 里 5 个 mqtt 实体一上线就有值，不必等下一次操作。
  #   priority: -100 = 最后执行（其他 on_boot 都跑完）。
  on_boot:
    priority: -100
    then:
      - delay: 20s
      - script.execute: mqtt_pub_state

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  logs:
    lvgl: WARN
    # 注：ESPHome 不允许某个 tag 的级别「比全局更细」
    #   （notify: DEBUG + 全局 INFO 会直接报 Failed config），
    #   所以通知链路的诊断日志一律用 ESP_LOGI，走全局 INFO 即可见。
    #   量很小：只在收到新消息、以及真的重绘时各打一两行。

api:
  encryption:
    key: !secret api_key
  # API 重连参数：网络抖动时自动恢复，不必改
  reboot_timeout: 15min

ota:
  - platform: esphome
    # 空的 encryption: 块（bare block）= 声明「OTA 必须加密，密钥继承 api 的 api_key」。
    #   ESPHome 在编译时把 api_key 填进来（见 components/esphome/ota 的 _resolve_encryption_key），
    #   所以既不会出现「密钥不一致」的校验错误，也不会被 Dashboard 判定为「另外配了一把密钥」。
    #   效果：明文 OTA 上传被拒绝；Dashboard 的两条安全提示都会消失。
    # 注意：从旧版 password 升级到加密 OTA，需 USB 线刷一次；之后无线 OTA 正常用。
    encryption:

# ==========================================================
# MQTT（外网远程通道）
# ==========================================================
mqtt:
  broker: !secret mqtt_broker      # 阿里云 DDNS 解析到你家公网 IP（地址放 secrets.yaml）
  port: !secret mqtt_port           # secrets.yaml 里配，明文 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  # topic_prefix 只影响本机"对外发布"的主题前缀。
  # 注意：本机不再向 HA 暴露任何实体（全部 internal: true），
  #       所以 discovery 关掉，避免在 HA 里生成一堆没用的空实体。
  topic_prefix: esphome/ha-monitor-display
  discovery: false
  keepalive: 30s
  reboot_timeout: 0s              
  clean_session: true
  # --- 主题规划 ---
  log_topic:
    topic: esphome/ha-monitor-display/logs
    level: INFO

  # ==========================================================
  # 订阅 HA 推送的数据帧
  # ==========================================================
  on_json_message:
    topic: home/ha-monitor-display
    then:
      - lambda: |-
          // 平铺赋值：每个 JSON key → 一个 ha_* 全局变量
          //   数值：is<float>() 判断，不可用（JSON null）时给 NAN，
          //        与页面里的 std::isfinite() 判断天然衔接
          //   布尔：| false 默认值操作符
          //   文本：is<const char *>() 判断，缺省给空串
          id(hd_ts) = x["ts"] | 0u;
          if (x["fan1_rpm"].is<float>()) id(hd_fan1_rpm) = x["fan1_rpm"].as<float>();
          else id(hd_fan1_rpm) = NAN;
          if (x["fan2_rpm"].is<float>()) id(hd_fan2_rpm) = x["fan2_rpm"].as<float>();
          else id(hd_fan2_rpm) = NAN;
          if (x["fan1_speed"].is<float>()) id(hd_fan1_speed) = x["fan1_speed"].as<float>();
          else id(hd_fan1_speed) = NAN;
          if (x["fan2_speed"].is<float>()) id(hd_fan2_speed) = x["fan2_speed"].as<float>();
          else id(hd_fan2_speed) = NAN;
          if (x["temp_front"].is<float>()) id(hd_temp_front) = x["temp_front"].as<float>();
          else id(hd_temp_front) = NAN;
          if (x["temp_back"].is<float>()) id(hd_temp_back) = x["temp_back"].as<float>();
          else id(hd_temp_back) = NAN;
          if (x["temp_in"].is<float>()) id(hd_temp_in) = x["temp_in"].as<float>();
          else id(hd_temp_in) = NAN;
          if (x["temp_out"].is<float>()) id(hd_temp_out) = x["temp_out"].as<float>();
          else id(hd_temp_out) = NAN;
          if (x["family_home"].is<float>()) id(hd_family_home) = x["family_home"].as<float>();
          else id(hd_family_home) = NAN;
          if (x["guest_visit"].is<float>()) id(hd_guest_visit) = x["guest_visit"].as<float>();
          else id(hd_guest_visit) = NAN;
          if (x["phone_online"].is<float>()) id(hd_phone_online) = x["phone_online"].as<float>();
          else id(hd_phone_online) = NAN;
          if (x["server_count"].is<float>()) id(hd_server_count) = x["server_count"].as<float>();
          else id(hd_server_count) = NAN;
          if (x["gateway_count"].is<float>()) id(hd_gateway_count) = x["gateway_count"].as<float>();
          else id(hd_gateway_count) = NAN;
          if (x["ap_count"].is<float>()) id(hd_ap_count) = x["ap_count"].as<float>();
          else id(hd_ap_count) = NAN;
          if (x["monitor_count"].is<float>()) id(hd_monitor_count) = x["monitor_count"].as<float>();
          else id(hd_monitor_count) = NAN;
          if (x["light_on"].is<float>()) id(hd_light_on) = x["light_on"].as<float>();
          else id(hd_light_on) = NAN;
          if (x["curtain_closed"].is<float>()) id(hd_curtain_closed) = x["curtain_closed"].as<float>();
          else id(hd_curtain_closed) = NAN;
          if (x["climate_on"].is<float>()) id(hd_climate_on) = x["climate_on"].as<float>();
          else id(hd_climate_on) = NAN;
          if (x["equipment_on"].is<float>()) id(hd_equipment_on) = x["equipment_on"].as<float>();
          else id(hd_equipment_on) = NAN;
          if (x["weather_temp"].is<float>()) id(hd_weather_temp) = x["weather_temp"].as<float>();
          else id(hd_weather_temp) = NAN;
          if (x["outdoor_temp"].is<float>()) id(hd_outdoor_temp) = x["outdoor_temp"].as<float>();
          else id(hd_outdoor_temp) = NAN;
          if (x["energy_today"].is<float>()) id(hd_energy_today) = x["energy_today"].as<float>();
          else id(hd_energy_today) = NAN;
          if (x["gas_today"].is<float>()) id(hd_gas_today) = x["gas_today"].as<float>();
          else id(hd_gas_today) = NAN;
          if (x["voltage"].is<float>()) id(hd_voltage) = x["voltage"].as<float>();
          else id(hd_voltage) = NAN;
          if (x["water_pressure"].is<float>()) id(hd_water_pressure) = x["water_pressure"].as<float>();
          else id(hd_water_pressure) = NAN;
          if (x["xuanyi_dist"].is<float>()) id(hd_xuanyi_dist) = x["xuanyi_dist"].as<float>();
          else id(hd_xuanyi_dist) = NAN;
          if (x["byd_dist"].is<float>()) id(hd_byd_dist) = x["byd_dist"].as<float>();
          else id(hd_byd_dist) = NAN;
          if (x["wan_uptime"].is<float>()) id(hd_wan_uptime) = x["wan_uptime"].as<float>();
          else id(hd_wan_uptime) = NAN;
          if (x["asr_count"].is<float>()) id(hd_asr_count) = x["asr_count"].as<float>();
          else id(hd_asr_count) = NAN;
          if (x["router_count"].is<float>()) id(hd_router_count) = x["router_count"].as<float>();
          else id(hd_router_count) = NAN;
          if (x["device_ctrl"].is<float>()) id(hd_device_ctrl) = x["device_ctrl"].as<float>();
          else id(hd_device_ctrl) = NAN;
          if (x["terminal_count"].is<float>()) id(hd_terminal_count) = x["terminal_count"].as<float>();
          else id(hd_terminal_count) = NAN;
          if (x["low_battery"].is<float>()) id(hd_low_battery) = x["low_battery"].as<float>();
          else id(hd_low_battery) = NAN;
          if (x["nas_cpu"].is<float>()) id(hd_nas_cpu) = x["nas_cpu"].as<float>();
          else id(hd_nas_cpu) = NAN;
          if (x["nas_mem"].is<float>()) id(hd_nas_mem) = x["nas_mem"].as<float>();
          else id(hd_nas_mem) = NAN;
          if (x["screen_bright"].is<float>()) id(hd_screen_bright) = x["screen_bright"].as<float>();
          else id(hd_screen_bright) = NAN;
          if (x["nas_download"].is<float>()) id(hd_nas_download) = x["nas_download"].as<float>();
          else id(hd_nas_download) = NAN;
          if (x["nas_upload"].is<float>()) id(hd_nas_upload) = x["nas_upload"].as<float>();
          else id(hd_nas_upload) = NAN;

          // 开关类三态：-1=实体不存在/无数据，0=关，1=开
          //（HA 侧宏 sw() 在实体不可用时输出 null，此处落成 -1）
          // 在线设备指示两格（通用槽位，名称由 HA 下发，固件不写死任何具体设备）
          id(hd_device_a_online) = x["device_a_online"].is<int>() ? x["device_a_online"].as<int>() : -1;
          id(hd_device_b_online) = x["device_b_online"].is<int>() ? x["device_b_online"].as<int>() : -1;
          id(hd_wan_status)      = x["wan_status"].is<int>()      ? x["wan_status"].as<int>()      : -1;
          id(hd_voice_broadcast) = x["voice_broadcast"].is<int>() ? x["voice_broadcast"].as<int>() : -1;
          id(hd_fan_in_switch)   = x["fan_in_switch"].is<int>()   ? x["fan_in_switch"].as<int>()   : -1;
          id(hd_fan_out_switch)  = x["fan_out_switch"].is<int>()  ? x["fan_out_switch"].as<int>()  : -1;

          id(hd_time_text) = x["time_text"].is<const char *>() ? std::string(x["time_text"].as<const char *>()) : std::string();
          // 在线设备两格的显示名称（HA 下发；留空则界面用默认「设备1/设备2」）
          id(hd_device_a_name) = x["device_a_name"].is<const char *>() ? std::string(x["device_a_name"].as<const char *>()) : std::string();
          id(hd_device_b_name) = x["device_b_name"].is<const char *>() ? std::string(x["device_b_name"].as<const char *>()) : std::string();
          id(hd_external_ip) = x["external_ip"].is<const char *>() ? std::string(x["external_ip"].as<const char *>()) : std::string();
          id(hd_weather) = x["weather"].is<const char *>() ? std::string(x["weather"].as<const char *>()) : std::string();
          id(hd_stock) = x["stock"].is<const char *>() ? std::string(x["stock"].as<const char *>()) : std::string();
          // 上证涨跌幅：JSON 数字直接取；HA 若发字符串（如 "0.35"）用 atof 兜底；null/缺失 → NAN（界面显灰）
          if (x["stock_chg"].is<float>())             id(hd_stock_chg) = x["stock_chg"].as<float>();
          else if (x["stock_chg"].is<const char *>()) id(hd_stock_chg) = atof(x["stock_chg"].as<const char *>());
          else                                        id(hd_stock_chg) = NAN;
          id(hd_home_mode) = x["home_mode"].is<const char *>() ? std::string(x["home_mode"].as<const char *>()) : std::string();
          id(hd_activity_log) = x["activity_log"].is<const char *>() ? std::string(x["activity_log"].as<const char *>()) : std::string();
          // 音量百分比：数字直接用；HA 若发 "65%"/"65" 之类字符串则提数字；null/缺失/非数字 → NAN
          {
            float mv = NAN;
            if (x["mode_volume"].is<float>()) {
              mv = x["mode_volume"].as<float>();
            } else if (x["mode_volume"].is<const char *>()) {
              const char *p = x["mode_volume"].as<const char *>();
              if (p != nullptr && ((p[0] >= '0' && p[0] <= '9') || p[0] == '-')) mv = atof(p);
            }
            id(hd_mode_volume) = std::isfinite(mv) ? mv : NAN;
            static bool mv_warned = false;
            if (!std::isfinite(mv) && !mv_warned) {
              mv_warned = true;
              ESP_LOGW("ha_data", "mode_volume 缺失或非数值（HA 侧 sensor.ju_jia_mo_shi 无 volume_percent 属性？）");
            }
          }
          id(hd_parking_status) = x["parking_status"].is<const char *>() ? std::string(x["parking_status"].as<const char *>()) : std::string();

          id(ha_data_last_ms) = millis();
          ESP_LOGD("ha_data", "收到数据帧 ts=%u", (unsigned) id(hd_ts));

  # ==========================================================
  # 订阅通知消息（v2.0 NOTIFY）
  # ----------------------------------------------------------
  #   主题 home/ha-monitor-display/notify，QoS1，retain=false。
  #   MQTT 主题精确匹配，上面的数据帧订阅收不到子主题，两条互不干扰。
  #   载荷优先按 JSON {title,message,ts} 解析（Node-RED 子流程的格式）；
  #   不是 JSON 就整段当正文，HA 原生 mqtt.publish 发纯文本也能上屏。
  #   入库统一走 ns_notify（include/notify_store.h）：8 槽环形 + UTF-8 安全截断 + 重复丢弃。
  # ==========================================================
  on_message:
    - topic: home/ha-monitor-display/notify
      then:
        - lambda: |-
            std::string nt;
            std::string nm;
            uint32_t nts = 0;
            bool parsed = false;

            if (!x.empty() && x[0] == '{') {
              parsed = esphome::json::parse_json(x, [&](JsonObject root) -> bool {
                if (root["title"].is<const char *>()) nt = root["title"].as<const char *>();
                if (root["message"].is<const char *>()) nm = root["message"].as<const char *>();
                // ts 统一归一成「秒」：Node-RED 里 Date.now() 给的是 13 位毫秒，
                //   直接塞进 uint32_t 会溢出成乱七八糟的值（时间显示错乱甚至空白），
                //   所以先按 64 位读，超过 1e11 就除 1000。
                if (root["ts"].is<const char *>()) {
                  const unsigned long long raw =
                      strtoull(root["ts"].as<const char *>(), nullptr, 10);
                  nts = static_cast<uint32_t>(raw > 100000000000ULL ? raw / 1000 : raw);
                } else if (!root["ts"].isNull()) {
                  const uint64_t raw = root["ts"].as<uint64_t>();
                  nts = static_cast<uint32_t>(raw > 100000000000ULL ? raw / 1000 : raw);
                }
                return true;
              });
            }
            if (!parsed || (nt.empty() && nm.empty())) {
              nt.clear();
              nm = x;                                  // 非 JSON 载荷：整段当正文
            }
            if (nt.empty() && nm.empty()) return;

            // 诊断（第九轮加）：入库前的「原始」message 有几个换行 ——
            //   0 个 = 换行在上游（HA 模板 / NR 上游节点）就丢了，设备端无从恢复；
            //   >0 个但入库后变少 = 设备端处理链有问题（目前没有这种迹象）。
            {
              int raw_nl = 0;
              for (size_t k = 0; k < nm.size(); k++)
                if (nm[k] == '\n') raw_nl++;
              ESP_LOGI("notify", "原始 message %u字节/%d个换行 标题[%s]",
                       (unsigned) nm.size(), raw_nl, nt.c_str());
            }

            // 去重在 push 内部做（要拿归一 + 折行后的值比才准，见 notify_store.h）
            ns_notify::push(nt, nm, nts);
            {
              // 诊断日志（用户 11-01 要求抓串口）：一行看完入库结果
              //   正文 N 字节 / M 行 —— 行数是数 '\n' 得来的
              //   若 行数=1 而字节数很大，说明 wrap_hard 没跑到（折行没生效）
              //   再往下一条「全文」把正文原样吐出来，串口里会真的断成多行
              const std::string &mm = ns_notify::at(0).msg;
              int nl = 0;
              for (size_t k = 0; k < mm.size(); k++)
                if (mm[k] == '\n') nl++;
              ESP_LOGI("notify", "入列 共%d条 未读%d条 [%s] 正文%u字节/%d行 首行:%.46s",
                       ns_notify::count, ns_notify::unread,
                       ns_notify::at(0).title.c_str(),
                       (unsigned) mm.size(), nl + 1, mm.c_str());
              ESP_LOGI("notify", "全文:\n%s", mm.c_str());
            }

            // 通知亮屏与跳页见下方动作链（v3.3）：这里只管入库
        # ==========================================================
        # 通知亮屏并直跳通知页（v3.3）
        #   以前只唤醒背光，15 秒里停在原页面，用户得先摸一下 TAB 才看得见通知。
        #   现在：关屏状态下收到通知 → 切 notify_page + 唤醒（保持 15s，见 wake_screen）。
        #   · 条件里带 ui_screen_off：屏亮着时不抢页面，避免用户正看家居页被顶走；
        #   · lvgl.page.show 必须走动作队列，不能在 MQTT 回调的 lambda 里直接 lv_scr_load；
        #   · notify_page 的 on_load 会自动置 ui_current_page=4 并清未读，TAB 高亮同步。
        # ==========================================================
        - if:
            condition:
              lambda: 'return id(notify_wake_on_msg).state && id(ui_screen_off) && id(lvgl_ready);'
            then:
              - lvgl.page.show: notify_page
              - script.execute: wake_screen

    # ==========================================================
    # v2.1 远程控制通道（屏幕带出门后仍可控制）
    # ----------------------------------------------------------
    #   痛点：亮度/亮屏时间/两个开关原先只走 Native API，要求 HA 能
    #     主动连到屏幕。屏幕一出门（无公网 IP、穿过 NAT）这条线就断，
    #     而 MQTT 是设备主动往外连，所以数据一直好、控制全废。
    #   做法：把这 5 项也挂到 MQTT 上，payload 就是简单值，
    #     应用后立刻回发状态帧（retain），HA 面板实时跟随。
    #   主题（全部 retain，QoS1）：
    #     .../cmd/light     ON | OFF                屏幕开关（开=唤醒到上次亮度）
    #     .../cmd/bright    10~100                  亮度百分比
    #     .../cmd/sleep     15~900                  熄屏超时（秒）
    #     .../cmd/autosleep ON | OFF                自动休眠总开关
    #     .../cmd/wake      ON | OFF                收到通知时亮屏
    #   注：cmd 主题 retain，所以设备重连/重启会重放 HA 最后一次下发的值，
    #     即「重启后以 HA 侧为准」，比本机 restore_value 更可预期。
    # ==========================================================
    - topic: home/ha-monitor-display/cmd/light
      qos: 1
      then:
        - lambda: |-
            const bool on = (x == "ON" || x == "on" || x == "1");
            ESP_LOGI("cmd", "remote light -> %s", on ? "ON" : "OFF");
            if (on) {
              if (id(ui_screen_off)) {
                id(wake_screen).execute();
              } else {
                auto call = id(lcd_backlight).turn_on();
                call.set_brightness(id(ui_saved_brightness));
                call.perform();
              }
            } else {
              id(sleep_screen).execute();
            }
        - script.execute: mqtt_pub_state

    - topic: home/ha-monitor-display/cmd/bright
      qos: 1
      then:
        - lambda: |-
            auto v = esphome::parse_number<float>(x);
            if (!v.has_value()) return;
            float pct = *v;
            if (pct < 10.0f) pct = 10.0f;      // 与滑块实体 min 一致，防调到看不见
            if (pct > 100.0f) pct = 100.0f;
            ESP_LOGI("cmd", "remote brightness -> %.0f%%", pct);
            // 直接走滑块实体的 set_action：ui_saved_brightness 与灯实体一次到位
            auto call = id(screen_brightness_number).make_call();
            call.set_value(pct);
            call.perform();
        - script.execute: mqtt_pub_state

    - topic: home/ha-monitor-display/cmd/sleep
      qos: 1
      then:
        - lambda: |-
            auto v = esphome::parse_number<float>(x);
            if (!v.has_value()) return;
            float s = *v;
            if (s < 15.0f) s = 15.0f;
            if (s > 900.0f) s = 900.0f;
            ESP_LOGI("cmd", "remote sleep timeout -> %.0fs", s);
            auto call = id(sleep_timeout_number).make_call();
            call.set_value(s);
            call.perform();
        - script.execute: mqtt_pub_state

    - topic: home/ha-monitor-display/cmd/autosleep
      qos: 1
      then:
        - lambda: |-
            const bool on = (x == "ON" || x == "on" || x == "1");
            ESP_LOGI("cmd", "remote auto sleep -> %s", on ? "ON" : "OFF");
            if (on) id(auto_sleep_switch).turn_on();
            else id(auto_sleep_switch).turn_off();
        - script.execute: mqtt_pub_state

    - topic: home/ha-monitor-display/cmd/wake
      qos: 1
      then:
        - lambda: |-
            const bool on = (x == "ON" || x == "on" || x == "1");
            ESP_LOGI("cmd", "remote notify wake -> %s", on ? "ON" : "OFF");
            if (on) id(notify_wake_on_msg).turn_on();
            else id(notify_wake_on_msg).turn_off();
        - script.execute: mqtt_pub_state

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # modem-sleep：无流量时 WiFi 进省电态，待机电流约省 1/3。
  # 代价仅是响应略慢（数据帧 5s 一推，感知不到），MQTT keepalive 15s 不受影响。
  power_save_mode: light
  ap:
    ssid: HA Monitor Fallback
    password: !secret ap_password

captive_portal:
web_server:
  port: 80
  version: 3
  auth:
    # digest：密码只以哈希形式走网络（basic 是 Base64，等于明文）
    # 2027.1.0 起 ESPHome 的默认值也会变成 digest，现在显式指定可提前对齐。
    # 注意：用 curl 等 REST 客户端访问需加 --digest（例：curl --digest -u admin:密码 http://IP/）。
    type: digest
    username: admin
    password: !secret web_password

# --- 屏幕硬件配置 ---
spi:
  id: display_spi
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

i2c:
  id: touch_i2c
  scl: GPIO6
  sda: GPIO7
  frequency: 100kHz

output:
  - platform: ledc
    pin:
      number: GPIO15
    id: lcd_backlight_pwm
    frequency: 20kHz

light:
  - platform: monochromatic
    id: lcd_backlight
    name: "Screen Light"
    icon: mdi:monitor
    output: lcd_backlight_pwm
    # ALWAYS_OFF：开机不自带满亮点亮，由 lvgl on_boot 按 ui_saved_brightness（默认 60%）点亮，
    # 避免开机先全亮一秒再暗下来的闪变。休眠/唤醒见 script sleep_screen / wake_screen。
    restore_mode: ALWAYS_OFF

display:
  - platform: mipi_spi
    id: lcd_display
    model: CUSTOM
    dimensions: 320x480
    spi_id: display_spi
    cs_pin: GPIO10
    dc_pin: GPIO9
    reset_pin: GPIO8
    data_rate: 40MHz
    transform:
      mirror_x: true
      mirror_y: false
      swap_xy: false
    rotation: 0
    color_order: bgr
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
    init_sequence:
      - [0xF0, 0xC3]
      - [0xF0, 0x96]
      - [0xB4, 0x02]
      - [0xB7, 0xC6]
      - [0xC0, 0xC0, 0x00]
      - [0xC1, 0x13]
      - [0xC2, 0xA7]
      - [0xC5, 0x21]
      - [0xE8, 0x40, 0x8A, 0x1B, 0x1B, 0x23, 0x0A, 0xAC, 0x33]
      - [0xE0, 0xD2, 0x05, 0x08, 0x06, 0x05, 0x02, 0x2A, 0x44, 0x46, 0x39, 0x15, 0x15, 0x2D, 0x32]
      - [0xE1, 0x96, 0x08, 0x0C, 0x09, 0x09, 0x25, 0x2E, 0x43, 0x42, 0x35, 0x11, 0x11, 0x28, 0x2E]
      - [0xF0, 0x3C]
      - [0xF0, 0x69]

touchscreen:
  - platform: ft63x6
    id: touch_panel
    i2c_id: touch_i2c
    address: 0x38
    display: lcd_display
    reset_pin: GPIO5
    update_interval: 20ms
    on_touch:
      - lambda: id(ui_touch_active) = true;
      # 熄屏状态下任意触摸立即点亮
      - if:
          condition:
            lambda: return id(ui_screen_off);
          then:
            - script.execute: wake_screen
    on_release:
      - lambda: id(ui_touch_active) = false;

# ==========================================================
# 声音输出：MAX98357A（I2S 数字功放）  v2.2.0 新增 2026-11-07
#   接线：VIN→5V(J1-1) / GND→GND(J1-2)
#         BCLK→GPIO39 / LRC→GPIO40 / DIN→GPIO41 / SD→GPIO21
#         喇叭 ± 接 BTL 输出——**两端都不可接地**，否则烧功放
#   省电：SD 由 GPIO21 控制，不播放时拉低 → 功放待机 <1µA
#         （悬空或接 VDD 会常耗 2.4mA，对 20mA 待机是 +12%）
#   引脚全部选在模块**右侧**，与左侧的 SPI(11/12/13) 和 I2C(6/7) 分开，
#     避免 BCLK 与 SCK(40MHz) 长距离并行串扰，走线也顺。
#     ⚠️ 原选 47/48/38 已废弃（v2.2.1 换掉），两个原因：
#        ① 47/48/38 正是 DevKitC-1 板载 WS2812 彩灯的脚（v1.0=48 / v1.1=38），
#          I2S 位流被 WS2812 误解析 → 灯变纯白常亮，且给数据线挂负载；
#        ② 若是 WROOM-2（N16R8V），GPIO47/48 在 VDD_SPI 1.8V 域，输出仅 1.8V，
#          驱动 MAX98357A(VIH=1.3V) 余量太小。
#     39/40/41 是 JTAG 复用脚，ESPHome 不用 JTAG（UART/OTA 烧录），可安全占用。
#     避开的：35/36/37(octal PSRAM)、19/20(USB)、0/3/45/46(strapping)、
#             43/44(UART0)、4(TF 卡预留，且已加 10k 上拉)
# ==========================================================
i2s_audio:
  # 注意：i2s_audio 是单实例组件（不是列表，写成 `- id:` 会校验失败）
  id: i2s_out
  i2s_lrclk_pin: GPIO40
  i2s_bclk_pin: GPIO39

speaker:
  - platform: i2s_audio
    id: spk_out
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO41
    dac_type: external            # MAX98357A = 外部 DAC + D 类功放
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: mono                 # 单喇叭，单声道省一半带宽与解码开销
    buffer_duration: 300ms
    timeout: 500ms

  # mixer：把「媒体」与「播报」两条流水线合成一路送给同一个喇叭。
  # 必须用 mixer —— ESPHome 不允许两条 pipeline 指向同一个 speaker 实例。
  # 两条都是 48kHz / mono，采样率一致，所以不需要 resampler。
  - platform: mixer
    id: spk_mix
    output_speaker: spk_out
    task_stack_in_psram: true
    source_speakers:
      - id: spk_media_in            # TTS / 音乐 / play_media 走这条
      - id: spk_announce_in         # 紧急播报走这条（可 ducking 压低媒体音量）

media_player:
  - platform: speaker
    id: mp_screen
    name: "Screen Speaker"
    icon: mdi:speaker
    # announcement_pipeline 在 schema 里是 Required，media 才是 Optional；
    # 两条都配上，TTS(走 media) 与紧急播报(走 announcement) 才能分别工作。
    media_pipeline:
      speaker: spk_media_in
      format: FLAC                # HA(≥2024.10) 负责转码，设备端只解码，省 CPU
      sample_rate: 48000
      num_channels: 1
    announcement_pipeline:
      speaker: spk_announce_in
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    buffer_size: 120000           # 每条流水线 120KB（大块 malloc 落 PSRAM）
    task_stack_in_psram: true     # 8MB octal PSRAM，任务栈不占内部 RAM
    volume_initial: 60%
    # ⚠️ 上限压到 70%，不是 90%：
    #   4Ω/3W 喇叭在 5V 下满量程 3.2W，峰值电流 ≈1.26A@4Ω，
    #   电池 3.99V 要输出 1.7A 输入，会直接踩 IP5407 的过流/欠压打嗝。
    #   70% 音量 ≈ 1.5W 峰值，电池撑得住，响度对室内信息屏已经够。
    volume_max: 70%
    files:                        # 内置音效：断网 / HA 宕机也能响
      - id: snd_ding
        file: sounds/ding.wav
      - id: snd_notify
        file: sounds/notify.wav
      - id: snd_alarm
        file: sounds/alarm.wav

# 内置音效的调用方式（v2.2.1 删掉了 3 个 template button —— 它们只是手动试音键，
# 与 media_player 实体功能重复；自动化直接调下面的动作即可，能力一点没少）
# HA 自动化里要响，直接调动作：
#   action: media_player.speaker.play_on_device_media_file
#   data: { entity_id: media_player.ha_monitor_display_screen_speaker, media_file: snd_ding }
# TTS 播报：action: tts.speak（target: media_player.ha_monitor_display_screen_speaker）

# --- 时间 ---
# ==========================================================
# 时间：只用 SNTP，不依赖 HA
#   （原 platform: homeassistant 的 time 也需要 Native API，
#     出门后不可用；SNTP 只要设备能上网就能对时）
# ==========================================================
time:
  - platform: sntp
    id: system_time
    timezone: Asia/Shanghai
    servers:
      - ntp.aliyun.com
      - cn.pool.ntp.org
      - time.cloudflare.com

lvgl:
  displays: [lcd_display]
  touchscreens: [touch_panel]
  rotation: 270                     # 横屏 480x320（竖装倒置：由 90 翻 180°）
  buffer_size: "25%"
  draw_rounding: 8
  resume_on_input: false
  on_boot:
    - delay: 800ms
    - lambda:
        ESP_LOGI("custom", "LVGL is ready!");
        id(lvgl_ready) = true;
    # 开机默认进入家居页
    - lvgl.page.show: dashboard_page
    # 开机点亮背光：亮度取 ui_saved_brightness（默认 60%，熄屏恢复同源）
    - light.turn_on:
        id: lcd_backlight
        brightness: !lambda |-
          return id(ui_saved_brightness);
  default_font: ui_font_small
  theme:
    label:
      pressed:
        text_color: 0xFFFFFF

  # ==========================================================
  # 全局顶层：数据通道离线指示
  # ----------------------------------------------------------
  top_layer:
    widgets:
      # 离线图标（默认隐藏，由下方 interval 控制显隐）
      # mdi:cloud-off（实心断云）U+F1BF6；
      - label:
          id: offlink_icon
          align: TOP_RIGHT
          x: -9
          y: 6
          text: "\U000F1BF6"
          text_font: mdi_icons_12
          text_color: 0xFF5252
          hidden: true
      # 离线文字（与图标同一行，靠左显示"离线"两字）
      - label:
          id: offlink_text
          align: TOP_RIGHT
          x: -26
          y: 4
          text: "离线"
          text_font: ui_font_small
          text_color: 0xFF5252
          hidden: true

      # 未读红点（v2.0 NOTIFY）：压在 TAB「通知」键的右上角
      #   放在 top_layer 而不是 tab_bar.yaml 里 —— 片段被四页各 include 一次，
      #   带 id 会重复定义；这里单实例，四个页面顶部都能看到同一个点。
      #   x 跟着 TAB 走：TAB 第八轮右移 7px（≈1.2mm，通知键墨迹 379~419）
      #   第十轮：用户说「有新通知时能不能在 TAB 通知那里做个记号」——
      #   原来这个点只有 6px、还没描边，压在深色底上几乎看不见。改成 9px
      #   圆点 + 1px 深色描边（任何背景色下都能看出边界）。
      #   第十二轮（用户实测）：9px 时点儿落在「通知」两字正中间的上方，
      #   右移 18px、下移 2px 挪到两字右上角，同时放大到 11px 更好认。
      #   第十三轮：再左 1px、下 1px（439/273→438/274）；红点改浅绿 59D98B
      #   —— 红点在深色底上太像告警，绿点更接近「有新内容」的语义。
      - obj:
          id: notify_badge
          align: TOP_LEFT
          x: 438
          y: 274
          width: 11
          height: 11
          bg_color: 0x59D98B
          border_width: 1
          border_color: 0x1E1E1E
          outline_width: 0
          radius: 6
          scrollable: false
          hidden: true

# ==========================================================
# 未读红点巡检（v2.0 NOTIFY）
#   只看 unread 变化，没变化直接 return；进通知页即视为已读
# ==========================================================
interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(lvgl_ready)) return;
          static int last_unread = -1;
          const int u = (id(ui_current_page) == 4) ? 0 : ns_notify::unread;
          if (u == last_unread) return;
          last_unread = u;
          if (u > 0) lv_obj_clear_flag(id(notify_badge), LV_OBJ_FLAG_HIDDEN);
          else       lv_obj_add_flag(id(notify_badge), LV_OBJ_FLAG_HIDDEN);

  # ----------------------------------------------------------
  # 功放使能跟随播放状态
  #   拉高 SD → 功放上电；停止播放 3 秒后拉低 → 待机 <1µA
  #   注意：不能用 media_player 的 on_turn_on/on_turn_off，
  #         那两个只在收到 power 命令时触发，play_media 不会触发。
  #         speaker.is_running() 才反映"真的在出声"。
  # ----------------------------------------------------------
  - interval: 1s
    then:
      - lambda: |-
          // 用软件标志记录 SD 状态：GPIO switch 的 state 字段在不同版本里
          // 可见性不一致，直接读会在编译期报错，这里自己记一份最稳。
          static bool amp_on = false;
          const bool busy = id(spk_out).is_running();
          if (busy) {
            id(amp_idle_ms) = 0;
            if (!amp_on) {
              id(amp_sd).turn_on();
              amp_on = true;
            }
          } else if (amp_on) {
            if (id(amp_idle_ms) == 0) {
              id(amp_idle_ms) = millis();
            } else if (millis() - id(amp_idle_ms) > 3000) {
              id(amp_sd).turn_off();
              amp_on = false;
              id(amp_idle_ms) = 0;
            }
          }

debug:
  id: dbg_comp
  update_interval: 10s      # 数据刷新周期（loop_time / free 共用）

# ==========================================================
# HA 数据源
# ==========================================================
# ==========================================================
# 外网数据通道：MQTT 单主题 + 本地结构体缓存
# ----------------------------------------------------------
# 数据流：
#   HA 自动化(每5s) → mqtt publish home/ha-monitor-display (retain)
#     → 本机 on_json_message 解析 → ha_data 结构体
#       → 各 template 传感器(1s 刷新) → 页面 lambda 读取
#
# 注意：结构体字段名与 JSON key 必须一一对应，
#       改字段时同步改 ha/monitor_display_push.yaml
# ==========================================================
# 平铺 globals：每个 HA 字段一个独立全局变量
# ----------------------------------------------------------
# 约定：id 命名 = ha_ + JSON 字段名，一一对应，
#      改字段时同步改 ha/monitor_display_push.yaml。
globals:
  # 功放静默计时（ms）：0 = 未开始计时。
  #   播放结束后等 3 秒再关 SD，避免连续两条播报之间反复开关功放（会有咔哒声）
  - id: amp_idle_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
