    id: ha_fan_in_switch
    internal: true
    lambda: |-
      // 三态：-1 表示 HA 侧实体不存在/无数据，此时不发布（保持 has_state=false）
      if (id(ha_data_last_ms) == 0 || id(hd_fan_in_switch) < 0) return {};
      return id(hd_fan_in_switch) != 0;
  # fan_out_switch
  - platform: template
