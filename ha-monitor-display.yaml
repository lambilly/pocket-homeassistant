    type: std::string
    restore_value: false
    initial_value: '""'

  # 最近一次收到有效数据的时刻（millis，0 表示从未收到）
  - id: ha_data_last_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # 数据新鲜度阈值：超过该毫秒数没收到新帧就认为离线
  #   推送周期 5s，取 15s（3 个周期）作为容错窗口
  - id: ha_stale_ms
    type: uint32_t
    restore_value: false
    initial_value: "15000"

