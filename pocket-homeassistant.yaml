number:
  # 熄屏超时（秒），默认 60s，HA 可调，重启后保留
  - platform: template
    id: sleep_timeout_number
    name: "Sleep Timeout"
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: "s"
    mode: box
    min_value: 15
    max_value: 900
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 60

  # 屏幕亮度滑块（%，v1.1.1）。唯一数据源 = 本机灯实体 lcd_backlight：
  #   显示值 lambda 轮询灯实体当前亮度（在 HA 里直接调 light 实体，滑块 2s 内跟随）；
  #   set_action 把滑块值写回灯实体，同时更新熄屏恢复用的 ui_saved_brightness。
  #   熄屏期间滑块显示空值，防止误触把屏点亮；最低 10% 防止调到看不见。
  - platform: template
    id: screen_brightness_number
    name: "Screen Brightness"
    icon: mdi:brightness-percent
    entity_category: config
    unit_of_measurement: "%"
    mode: slider
    min_value: 10
    max_value: 100
    step: 5
    update_interval: 2s
    lambda: |-
      if (id(ui_screen_off)) return {};
      return id(lcd_backlight).remote_values.get_brightness() * 100.0f;
    set_action:
      - lambda: |-
          const float b = x / 100.0f;
          id(ui_saved_brightness) = b;
          if (!id(ui_screen_off)) {
            auto call = id(lcd_backlight).turn_on();
            call.set_brightness(b);
            call.perform();
          }

select:
  # ----------------------------------------------------------
  # 每页卡片底色（HA 下拉选色，v1.1.0）
  #   只提供深色系：白字与橙紫绿蓝图标要在底色上读得清。
  #   固件侧保留每通道 0xFE 的防误填钳制（八轮起放开，图色可原样上屏）。
  #   选中即重绘（无需重启）；断电重启由 restore_value 恢复上次选择。
  #   缝隙色（四周边距/卡间）不单独暴露，由选色自动压暗到 50%。
  #   八档（10-31 十二轮定版）：石墨（默认）/ 深红 831C0C / 深黄 866603 /
  #     墨绿 0E3A20 / 浅蓝 017989 / 深蓝 14285A / 深紫 32174D / 深靛 241A48
  #   （深红 = 六轮 5A1818 与十轮 AD2001 的逐通道中间值，白字对比约 9.1:1；
  #     橙色 866603 只改名"深黄"色值不动；深靛 241A48 为五轮三档旧值新增）
  #   注：六色相档下灰 757575 对底色只有 1.3~2.2:1，灰状态字（断开/无数据）
  #       会明显偏弱 —— 已与用户确认可接受，优先色相表现。
  # ----------------------------------------------------------
  - platform: template
    id: sel_bg_dash
    name: "Dashboard Bg Color"
    icon: mdi:palette
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "石墨 1E1E1E"
    options:
      - "石墨 1E1E1E"
      - "深红 831C0C"
      - "深黄 866603"
      - "墨绿 0E3A20"
      - "浅蓝 017989"
      - "深蓝 14285A"
      - "深紫 32174D"
      - "深靛 241A48"
    on_value:
      - lambda: |-
          // 选项形如“深蓝 13223B”，取末尾 6 位十六进制即色值
          if (x.size() < 6) return;
          id(ui_bg_dash) = (uint32_t) strtoul(x.c_str() + x.size() - 6, nullptr, 16);
      - script.execute:
          id: ui_apply_bg
          page: 0
      # 通知页共用家居底色（v2.0），同时跟随
      - script.execute:
          id: ui_apply_bg
          page: 3

  - platform: template
    id: sel_bg_net
    name: "Network Bg Color"
    icon: mdi:palette
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "石墨 1E1E1E"
    options:
      - "石墨 1E1E1E"
      - "深红 831C0C"
      - "深黄 866603"
      - "墨绿 0E3A20"
      - "浅蓝 017989"
      - "深蓝 14285A"
      - "深紫 32174D"
      - "深靛 241A48"
    on_value:
      - lambda: |-
          if (x.size() < 6) return;
          id(ui_bg_net) = (uint32_t) strtoul(x.c_str() + x.size() - 6, nullptr, 16);
      - script.execute:
          id: ui_apply_bg
          page: 1

  - platform: template
    id: sel_bg_sys
    name: "System Bg Color"
    icon: mdi:palette
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "石墨 1E1E1E"
    options:
      - "石墨 1E1E1E"
      - "深红 831C0C"
      - "深黄 866603"
      - "墨绿 0E3A20"
      - "浅蓝 017989"
      - "深蓝 14285A"
      - "深紫 32174D"
      - "深靛 241A48"
    on_value:
      - lambda: |-
          if (x.size() < 6) return;
          id(ui_bg_sys) = (uint32_t) strtoul(x.c_str() + x.size() - 6, nullptr, 16);
      - script.execute:
          id: ui_apply_bg
          page: 2

switch:
  # 自动休眠总开关（关掉后常亮，适合调试/演示）
  - platform: template
    id: auto_sleep_switch
    name: "Auto Screen Sleep"
    icon: mdi:sleep
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    lambda: |-
      return id(ui_auto_sleep_enabled);
    turn_on_action:
      - lambda: id(ui_auto_sleep_enabled) = true;
    turn_off_action:
      - lambda: id(ui_auto_sleep_enabled) = false;
      # 关闭自动休眠时顺便点亮，避免停在黑屏状态
      - script.execute: wake_screen

  # 通知亮屏开关（v2.0 NOTIFY）
  #   默认关：一次推送就唤醒屏幕，20mA 待机会瞬间回到 150mA+ 的亮屏功耗。
  #   打开后，收到通知且屏幕处于熄屏态时才点亮；亮屏中收到通知不受影响。
  - platform: template
    id: notify_wake_on_msg
    name: "Notify Wake Screen"
    icon: mdi:bell-ring
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

script:
  # ----------------------------------------------------------
  # 应用页面背景配色（v1.1.0）
  #   卡片底色 = HA 下拉选定色；四周 5px 边距 + 卡间 3px 缝隙 = 选定色 × 0.5
  #   一轮用 0.6 倍 + 每通道 0x40 钳制，实测切换档位几乎看不出差别；
  #   二轮（10-31）参考 HA iOS 深色主题色阶重做：
  #     - 缝隙系数 0.6 → 0.5，拉开卡片与底色的边界对比
  #     - 钳制上限 0x40 → 0x50，色相通道不再被压低
  #     - 8 档色值整体提饱和（石墨沿用 1E1E1E，默认观感不变）
  #   三轮（10-31）色板试过壁纸取色的 7 色，一度收敛为 3 档
  #   四轮（10-31）按用户要求放到 7 档；九轮（13:16）橙/浅蓝/深红改用用户提供的图色，
  #     钳制上限 0xB4→0xFE（图色 FE 顶原样上屏）；
  #   五轮（10-31）用户反馈偏亮，六档色相统一 ×0.75 压暗（石墨默认档不动）：
  #     石墨 1E1E1E / 深红 5A1818 / 墨绿 0E3A20 / 深蓝 14285A / 深紫 32174D；
  #     九轮：橙/浅蓝/深红用用户图色原样上屏（FEE677/01CFE2/FE7A58），
  #           白字对比 1.25/1.90/2.58 实测不可读，用户确认废弃；
  #     十轮：保图色色相压明度——橙色 866603（h45，白5.36）/ 浅蓝 017989（h187，白5.13）/ 深红 AD2001（h11，白7.04）
  #   十一轮：橙色 866603 改名"深黄"（色值不动）；新增深靛 241A48（五轮三档旧值，与深紫区分）；
  #   十二轮：深红偏暗，取六轮 5A1818 与十轮 AD2001 中间值 831C0C（白字对比 9.1:1），共八档
  #   page: 0=家居  1=网络  2=系统
  # ----------------------------------------------------------
  - id: ui_apply_bg
    mode: restart
    parameters:
      page: int
    then:
      - lambda: |-
          if (!id(lvgl_ready)) return;

          // 注意：page 对象是 LvPageType*，底层 lv_obj_t* 在 ->obj 成员里
          //   page: 0=家居 1=网络 2=系统 3=通知（v2.0，共用家居底色）
          lv_obj_t* scr = (page == 0) ? id(dashboard_page)->obj
                        : ((page == 1) ? id(network_page)->obj
                        : ((page == 2) ? id(system_page)->obj : id(notify_page)->obj));
          if (scr == nullptr) return;

          uint32_t c = (page == 0 || page == 3) ? id(ui_bg_dash)
                     : ((page == 1) ? id(ui_bg_net) : id(ui_bg_sys));

          // 亮度钳制（每通道 ≤ 0xFE）：只防纯白误填，不压色相（九轮放开）
          uint32_t r = (c >> 16) & 0xFF;
          uint32_t g = (c >> 8) & 0xFF;
          uint32_t b = c & 0xFF;
          if (r > 0xFE) r = 0xFE;
          if (g > 0xFE) g = 0xFE;
          if (b > 0xFE) b = 0xFE;
          const uint32_t card = (r << 16) | (g << 8) | b;

          // 缝隙/边距：同色压暗到 50%（拉出卡片轮廓）
          const uint32_t gap = ((r * 5 / 10) << 16) | ((g * 5 / 10) << 8) | (b * 5 / 10);
          lv_obj_set_style_bg_color(scr, lv_color_hex(gap), 0);

          // 所有顶层容器（各卡片 + TAB 导航栏）统一底色；跳过 5px 以下的装饰线
          const uint32_t n = lv_obj_get_child_count(scr);
          for (uint32_t i = 0; i < n; i++) {
            lv_obj_t* ch = lv_obj_get_child(scr, i);
            if (ch == nullptr) continue;
            if (lv_obj_get_height(ch) <= 5) continue;
            lv_obj_set_style_bg_color(ch, lv_color_hex(card), 0);
          }

  # 熄屏：先记住当前亮度，再关背光
  - id: sleep_screen
    mode: single
    then:
      - lambda: |-
          float b = id(lcd_backlight).remote_values.get_brightness();
          if (b <= 0.01f) b = 1.0f;   // 已接近 0 时按满亮度恢复，防锁死
          id(ui_saved_brightness) = b;
          id(ui_screen_off) = true;
          ESP_LOGI("sleep", "screen off, saved brightness=%.2f", b);
      - light.turn_off: lcd_backlight

  # 唤醒：恢复熄屏前的亮度（不是写死 100%）
  - id: wake_screen
    mode: single
    then:
      - lambda: |-
          // 唤醒后设保持期（默认 15s，熄屏超时更短则按更短的来）。
          //   亮屏不产生触摸输入，LVGL 的「无输入时间」不会归零，
          //   若它已超过阈值，1s 巡检会当场把屏关回去（通知闪一下就灭）。
          uint32_t hold = 15000;
          const uint32_t tmo = (uint32_t) (id(sleep_timeout_number).state * 1000.0f);
          if (tmo > 0 && tmo < hold) hold = tmo;
          id(ui_hold_until) = millis() + hold;
          id(ui_screen_off) = false;
      - light.turn_on:
          id: lcd_backlight
          brightness: !lambda |-
            return id(ui_saved_brightness);
      - logger.log: "screen on"

  # ----------------------------------------------------------
  # MQTT 状态回发（v2.1 远程控制通道）
  #   5 个受控量的当前值拼成一帧 JSON，retain 发到
  #   esphome/pocket-homeassistant/state，HA 侧 mqtt 实体据此显示。
  #   light = 屏幕是否点亮（!ui_screen_off）。
  #   bright 取 ui_saved_brightness（熄屏时滑块实体返回空值，不能拿它）。
  # ----------------------------------------------------------
  - id: mqtt_pub_state
    mode: restart
    then:
      - mqtt.publish:
          topic: esphome/pocket-homeassistant/state
          retain: true
          payload: !lambda |-
            char buf[192];
            snprintf(buf, sizeof(buf),
                     "{\"light\":%s,\"bright\":%d,\"sleep\":%d,"
                     "\"autosleep\":%s,\"wake\":%s}",
                     id(ui_screen_off) ? "false" : "true",
                     (int) (id(ui_saved_brightness) * 100.0f + 0.5f),
                     (int) id(sleep_timeout_number).state,
                     id(ui_auto_sleep_enabled) ? "true" : "false",
                     id(notify_wake_on_msg).state ? "true" : "false");
            return std::string(buf);

# ==========================================================
# 开关类实体（MQTT 数据帧落地）
# ----------------------------------------------------------
# 说明：TemplateBinarySensor 的 loop() 每轮都会调用 lambda 并
# publish_state()，本身就会实时刷新，无需 update_interval
# （该选项在 binary_sensor.template 上并不存在）。
# 但 loop() 在 MQTT 首帧到达前就会发布初始值，所以这里加
# ha_data_last_ms == 0 守卫，避免开机瞬间把 "--" 误判成"关"。
# ==========================================================
binary_sensor:
  # ==========================================================
  # BOOT 键（IO0）：短按 = 熄屏/唤醒切换（与触摸唤醒同一套脚本，状态一致）
  # ==========================================================
  - platform: gpio
    id: btn_boot
    name: "Boot Button"
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 50ms
    on_press:
      - if:
          condition:
            lambda: return id(ui_screen_off);
          then:
            - script.execute: wake_screen
          else:
            - script.execute: sleep_screen
  # device_a_online（通用槽位：任意 binary_sensor，名称由 HA 下发）
  - platform: template
    id: ha_device_a_online
    internal: true
    lambda: |-
      // 三态：-1 表示 HA 侧实体不存在/无数据，此时不发布（保持 has_state=false）
      if (id(ha_data_last_ms) == 0 || id(hd_device_a_online) < 0) return {};
      return id(hd_device_a_online) != 0;
  # device_b_online
  - platform: template
    id: ha_device_b_online
    internal: true
    lambda: |-
      // 三态：-1 表示 HA 侧实体不存在/无数据，此时不发布（保持 has_state=false）
      if (id(ha_data_last_ms) == 0 || id(hd_device_b_online) < 0) return {};
      return id(hd_device_b_online) != 0;
  # wan_status
  - platform: template
    id: net_wan_status
    internal: true
    lambda: |-
      // 三态：-1 表示 HA 侧实体不存在/无数据，此时不发布（保持 has_state=false）
      if (id(ha_data_last_ms) == 0 || id(hd_wan_status) < 0) return {};
      return id(hd_wan_status) != 0;
  # voice_broadcast
  - platform: template
    id: ha_voice_broadcast
    internal: true
    lambda: |-
      // 三态：-1 表示 HA 侧实体不存在/无数据，此时不发布（保持 has_state=false）
      if (id(ha_data_last_ms) == 0 || id(hd_voice_broadcast) < 0) return {};
      return id(hd_voice_broadcast) != 0;
  # fan_in_switch
  - platform: template
    id: ha_fan_in_switch
    internal: true
    lambda: |-
      // 三态：-1 表示 HA 侧实体不存在/无数据，此时不发布（保持 has_state=false）
      if (id(ha_data_last_ms) == 0 || id(hd_fan_in_switch) < 0) return {};
      return id(hd_fan_in_switch) != 0;
  # fan_out_switch
  - platform: template
    id: ha_fan_out_switch
    internal: true
    lambda: |-
      // 三态：-1 表示 HA 侧实体不存在/无数据，此时不发布（保持 has_state=false）
      if (id(ha_data_last_ms) == 0 || id(hd_fan_out_switch) < 0) return {};
      return id(hd_fan_out_switch) != 0;

