  # 最近一次收到有效数据的时刻（millis，0 表示从未收到）
  - id: ha_data_last_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # 数据新鲜度阈值：超过该毫秒数没收到新帧就认为离线
  #   推送周期 5s，取 15s（3 个周期）作为容错窗口
  - id: ha_stale_ms
    type: uint32_t
    restore_value: false
    initial_value: "15000"

# ==========================================================
# 本机传感器（与 HA 无关，始终可用）
# ==========================================================
sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi RSSI"
    icon: mdi:wifi
    update_interval: 15s
  - platform: uptime
    id: uptime_sensor
    icon: mdi:clock-start
    name: "Uptime"
  # ==========================================================
  # 板载电池采样（ES3C35P）：R14/R15 100K 分压进 IO8，读数 ×2 还原电池电压
  # ==========================================================
  - platform: adc
    pin: GPIO8
    id: bat_volt
    name: "Battery Voltage"
    attenuation: 12db
    update_interval: 30s
    unit_of_measurement: V
    accuracy_decimals: 2
    filters:
      - multiply: 2.0
      - median:
          window_size: 5
          send_every: 2
          send_first_at: 2
  - platform: copy
    source_id: bat_volt
    id: bat_pct
    name: "Battery Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters:
      - lambda: |-
          float p = (x - 3.30f) / (4.20f - 3.30f) * 100.0f;
          return clamp(p, 0.0f, 100.0f);

  # loop_time / free 只能写在 platform: debug 下（由顶层 debug: 组件接管）
  - platform: debug
    loop_time:
      id: loop_time_sensor
      name: "Loop Time"
  - platform: debug
    free:
      id: free_heap_sensor
      name: "Free Heap"

