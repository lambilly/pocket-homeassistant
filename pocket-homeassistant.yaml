# ── 触摸：ST77922 内置 TDDI 触摸（自定义组件，协议见 docs/触摸-ST77922.md）──
# 组件上报芯片原生竖屏坐标（320x480），与显示层原生方向一致；
# 横装旋转由 LVGL rotation 统一处理（渲染与触摸输入同步旋转）。
# ⚠️ transform 必须全关：换轴逻辑已从组件撤销（接 LVGL 后方向由 LVGL 管）。
touchscreen:
  - platform: st77922_touch
    id: touch_panel
    display: lcd_display
    reset_pin: GPIO48
    update_interval: 50ms
    calibration:           # 原生竖屏坐标 1:1
      x_min: 0
      x_max: 320
      y_min: 0
      y_max: 480
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    on_touch:
      - lambda: id(ui_touch_active) = true;
      # 熄屏状态下任意触摸立即点亮
      - if:
          condition:
            lambda: return id(ui_screen_off);
          then:
            - script.execute: wake_screen
    on_release:
      - lambda: id(ui_touch_active) = false;

# ==========================================================
# 时间：只用 SNTP，不依赖 HA
#   （原 platform: homeassistant 的 time 也需要 Native API，
#     出门后不可用；SNTP 只要设备能上网就能对时）
# ==========================================================
time:
  - platform: sntp
    id: system_time
    timezone: Asia/Shanghai
    servers:
      - ntp.aliyun.com
      - cn.pool.ntp.org
      - time.cloudflare.com

lvgl:
  displays: [lcd_display]
  touchscreens: [touch_panel]
  rotation: 90                      # 横装 480x320：LVGL 旋转渲染与触摸输入（若颠倒改 270）
  buffer_size: "25%"
  draw_rounding: 4   # ST77922 x 坐标 4 像素对齐
  resume_on_input: false
  on_boot:
    - delay: 800ms
    - lambda:
        ESP_LOGI("custom", "LVGL is ready!");
        id(lvgl_ready) = true;
    # 开机默认进入家居页
    - lvgl.page.show: dashboard_page
    # 开机点亮背光：亮度取 ui_saved_brightness（默认 60%，熄屏恢复同源）
    - light.turn_on:
        id: lcd_backlight
        brightness: !lambda |-
          return id(ui_saved_brightness);
  default_font: ui_font_small
  theme:
    label:
      pressed:
        text_color: 0xFFFFFF

  # ==========================================================
  # 全局顶层：数据通道离线指示
  # ----------------------------------------------------------
  top_layer:
    widgets:
      # 离线图标（默认隐藏，由下方 interval 控制显隐）
      # mdi:cloud-off（实心断云）U+F1BF6；
      - label:
          id: offlink_icon
          align: TOP_RIGHT
          x: -9
          y: 6
          text: "\U000F1BF6"
          text_font: mdi_icons_12
          text_color: 0xFF5252
          hidden: true
      # 离线文字（与图标同一行，靠左显示"离线"两字）
      - label:
          id: offlink_text
          align: TOP_RIGHT
          x: -26
          y: 4
          text: "离线"
          text_font: ui_font_small
          text_color: 0xFF5252
          hidden: true

      # 未读红点（v2.0 NOTIFY）：压在 TAB「通知」键的右上角
      #   放在 top_layer 而不是 tab_bar.yaml 里 —— 片段被四页各 include 一次，
      #   带 id 会重复定义；这里单实例，四个页面顶部都能看到同一个点。
      #   x 跟着 TAB 走：TAB 第八轮右移 7px（≈1.2mm，通知键墨迹 379~419）
      #   第十轮：用户说「有新通知时能不能在 TAB 通知那里做个记号」——
      #   原来这个点只有 6px、还没描边，压在深色底上几乎看不见。改成 9px
      #   圆点 + 1px 深色描边（任何背景色下都能看出边界）。
      #   第十二轮（用户实测）：9px 时点儿落在「通知」两字正中间的上方，
      #   右移 18px、下移 2px 挪到两字右上角，同时放大到 11px 更好认。
      #   第十三轮：再左 1px、下 1px（439/273→438/274）；红点改浅绿 59D98B
      #   —— 红点在深色底上太像告警，绿点更接近「有新内容」的语义。
      - obj:
          id: notify_badge
          align: TOP_LEFT
          x: 438
          y: 274
          width: 11
          height: 11
          bg_color: 0x59D98B
          border_width: 1
          border_color: 0x1E1E1E
          outline_width: 0
          radius: 6
          scrollable: false
          hidden: true

# ==========================================================
# 未读红点巡检（v2.0 NOTIFY）
#   只看 unread 变化，没变化直接 return；进通知页即视为已读
# ==========================================================
interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(lvgl_ready)) return;
          static int last_unread = -1;
          const int u = (id(ui_current_page) == 4) ? 0 : ns_notify::unread;
          if (u == last_unread) return;
          last_unread = u;
          if (u > 0) lv_obj_clear_flag(id(notify_badge), LV_OBJ_FLAG_HIDDEN);
          else       lv_obj_add_flag(id(notify_badge), LV_OBJ_FLAG_HIDDEN);

debug:
  id: dbg_comp
  update_interval: 10s      # 数据刷新周期（loop_time / free 共用）

# ==========================================================
# HA 数据源
# ==========================================================
# ==========================================================
# 外网数据通道：MQTT 单主题 + 本地结构体缓存
# ----------------------------------------------------------
# 数据流：
#   HA 自动化(每5s) → mqtt publish home/pocket-homeassistant (retain)
#     → 本机 on_json_message 解析 → ha_data 结构体
#       → 各 template 传感器(1s 刷新) → 页面 lambda 读取
#
# 注意：结构体字段名与 JSON key 必须一一对应，
#       改字段时同步改 ha/monitor_display_push.yaml
