##############################################################################
# Pocket HomeAssistant — 阶段二：整机基础能力
#
# 已启用：WiFi / API / OTA、背光调光、RGB 状态灯、电池电量(ADC)、BOOT 按键、
#         I2C 总线（供扩展口接传感器）、状态信息页
# 未启用：MQTT 数据帧、三页 UI、触摸、音频、TF 卡（见 docs 里的路线图）
# 已关闭：BLE 蓝牙代理（用户 2026-11-07 决定不要，避免与 WiFi 抢射频）
#
# 需要在 secrets.yaml 里补 4 项：
#   wifi_ssid / wifi_password / ap_password / api_key   （api_key 用 HA 里 ESPHome 向导生成的即可）
##############################################################################

substitutions:
  dev_name: pocket-homeassistant
  dev_friendly: Pocket HomeAssistant

esphome:
  name: ${dev_name}
  friendly_name: ${dev_friendly}
  on_boot:
    priority: 700
    then:
      - output.set_level:
          id: bkl
          level: 85%

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Pocket HA Fallback"
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

# ── 蓝牙：已关闭（2026-11-07 用户决定不做 BLE 代理，避免与 WiFi 争夺 2.4G 射频）
# 如需恢复，取消下面注释即可；务必保持 window < interval，否则 WiFi 会被饿死。
# esp32_ble_tracker:
#   scan_parameters:
#     interval: 320ms
#     window: 300ms
#     active: true
# bluetooth_proxy:
#   active: true

# ── 时间（来自 HA）────────────────────────────────────────────────
time:
  - platform: homeassistant
    id: ha_time

# ── I2C 扩展口（与触摸 0x55、ES8311 0x18 共用总线，地址勿撞）────────
i2c:
  sda: GPIO38
  scl: GPIO39
  frequency: 400kHz
  scan: true

# ── 背光（IO41 PWM）──────────────────────────────────────────────
output:
  - platform: ledc
    id: bkl
    pin: GPIO41
    frequency: 2000Hz

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: bkl
    restore_mode: ALWAYS_ON
  # 板载 WS2812 单灯（IO40）：状态指示 + HA 可控
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    pin: GPIO40
    chipset: ws2812
    num_leds: 1
    channel_colors: GRB   # WS2812 实际顺序 GRB（rgb_order 是同义旧名，已废弃）
    restore_mode: ALWAYS_OFF

# ── 电池：R14/R15 100K 分压进 IO8（ADC1_CH7），读数 ×2 还原电池电压 ──
sensor:
  - platform: adc
    pin: GPIO8
    id: bat_volt
    name: "Battery Voltage"
    attenuation: 12db
    update_interval: 30s
    unit_of_measurement: V
    accuracy_decimals: 2
    filters:
      - multiply: 2.0
      - median:
          window_size: 5
          send_every: 2
          send_first_at: 2

  - platform: copy
    source_id: bat_volt
    id: bat_pct
    name: "Battery Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters:
      - lambda: |-
          float p = (x - 3.30f) / (4.20f - 3.30f) * 100.0f;
          return clamp(p, 0.0f, 100.0f);

  - platform: wifi_signal
    id: wifi_db
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    id: up_s
    name: "Uptime"

# ── BOOT 键（IO0）：短按开关屏 ────────────────────────────────────
binary_sensor:
  - platform: gpio
    id: btn_boot
    name: "Boot Button"
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 50ms
    on_press:
      - light.toggle: backlight

text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_addr
      name: "IP Address"

# ── 屏幕：ST77922 QSPI（复用阶段一验证过的参数）──────────────────────
font:
  - file: "fonts/NotoSansSC-SemiBold.ttf"
    id: f22
    size: 22
    # 全 ASCII 可打印字符 + 常用符号。别再用「只列用到的字母」的写法——
    # 少一个字符就整行画不出来，日志只会刷 Codepoint not found。
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]^_`abcdefghijklmnopqrstuvwxyz{|}~°"

spi:
  id: lcd_qspi
  type: quad
  clk_pin: GPIO12
  data_pins:
    - GPIO11
    - GPIO13
    - GPIO14
    - GPIO9

display:
  - platform: mipi_spi
    id: lcd
    model: CUSTOM
    bus_mode: quad
    cs_pin: GPIO10
    dimensions: 320x480
    rotation: 90°
    transform: disabled
    data_rate: 40MHz
    draw_rounding: 4
    color_order: rgb
    invert_colors: true
    update_interval: 1s
    # lambda 内部已 it.fill() 铺满全屏，关掉驱动的自动清屏，省一次 307KB memset
    auto_clear_enabled: false
    init_sequence:
      - [0xF1, 0x00]
      - [0x60, 0x00, 0x00, 0x00]
      - [0x65, 0x80]
      - [0x79, 0x06]
      - [0x7B, 0x00, 0x08, 0x08]
      - [0x80, 0x55, 0x62, 0x2F, 0x17, 0xF0, 0x52, 0x70, 0xD2, 0x52, 0x62, 0xEA]
      - [0x81, 0x26, 0x52, 0x72, 0x27]
      - [0x84, 0x92, 0x25]
      - [0x87, 0x10, 0x10, 0x58, 0x00, 0x02, 0x3A]
      - [0x88, 0x00, 0x00, 0x2C, 0x10, 0x04, 0x00, 0x00, 0x00, 0x01, 0x01, 0x01, 0x01, 0x01, 0x00, 0x06]
      - [0x89, 0x00, 0x00, 0x00]
      - [0x8A, 0x13, 0x00, 0x2C, 0x00, 0x00, 0x2C, 0x10, 0x10, 0x00, 0x3E, 0x19]
      - [0x8B, 0x15, 0xB1, 0xB1, 0x44, 0x96, 0x2C, 0x10, 0x97, 0x8E]
      - [0x8C, 0x1D, 0xB1, 0xB1, 0x44, 0x96, 0x2C, 0x10, 0x50, 0x0F, 0x01, 0xC5, 0x12, 0x09]
      - [0x8D, 0x0C]
      - [0x8E, 0x33, 0x01, 0x0C, 0x13, 0x01, 0x01]
      - [0xB3, 0x00, 0x30]
      - [0x71, 0xD0]
      - [0x66, 0x02, 0x3F]
      - [0xBE, 0x26, 0x00, 0x9D]
      - [0x70, 0x01, 0xA6, 0x11, 0x40, 0xE0, 0x00, 0x11, 0x60, 0x11, 0x00, 0x00, 0x1A]
      - [0x90, 0x04, 0x04, 0x55, 0x74, 0x00, 0x40, 0x43, 0x2D, 0x2D]
      - [0x91, 0x04, 0x04, 0x55, 0x75, 0x00, 0x40, 0x42, 0x2D, 0x2D]
      - [0x92, 0x04, 0x44, 0x55, 0xC0, 0x06, 0x00, 0x07, 0x05, 0x90, 0x2D]
      - [0x93, 0x04, 0x43, 0x11, 0x00, 0x00, 0x00, 0x00, 0x05, 0x90, 0x2D]
      - [0x94, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0x95, 0x96, 0x16, 0x00, 0x00, 0xFF]
      - [0x96, 0x44, 0x53, 0x03, 0x12, 0x23, 0x24, 0x06, 0x05, 0x9A, 0x2D, 0x00, 0x44]
      - [0x97, 0x44, 0x53, 0x47, 0x56, 0x20, 0x20, 0x02, 0x01, 0x9A, 0x2D, 0x00, 0x44]
      - [0xBA, 0x55, 0x9A, 0x2D, 0x9A, 0x2D]
      - [0x9A, 0x40, 0x00, 0x06, 0x00, 0x00, 0x00, 0x00]
      - [0x9B, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x00]
      - [0x9C, 0x5C, 0x12, 0x00, 0x00, 0x10, 0x12, 0x00, 0x00, 0x10, 0x02, 0x00, 0x00, 0x00]
      - [0x9D, 0x8A, 0x51, 0x00, 0x00, 0x00, 0x80, 0x1E, 0x01]
      - [0x9E, 0x51, 0x00, 0x00, 0x00, 0x80, 0x1E, 0x01]
      - [0xB4, 0x1D, 0x1C, 0x1E, 0x0B, 0x14, 0x02, 0x13, 0x09, 0x1E, 0x00, 0x1E, 0x10]
      - [0xB5, 0x1D, 0x1C, 0x1E, 0x0A, 0x15, 0x03, 0x11, 0x08, 0x1E, 0x01, 0x1E, 0x12]
      - [0xB6, 0x77, 0x77, 0x00, 0x0A, 0xFF, 0x0A, 0xFF]
      - [0x86, 0xC6, 0x04, 0xB1, 0x02, 0x58, 0x12, 0x58, 0x0C, 0x13, 0x01, 0xA5, 0x00, 0xA5, 0xA5]
      - [0xB7, 0x07, 0x0A, 0x0E, 0x06, 0x05, 0x03, 0x2B, 0x03, 0x03, 0x42, 0x07, 0x10, 0x10, 0x2E, 0x3F, 0x0D]
      - [0xB8, 0x07, 0x0A, 0x0D, 0x05, 0x05, 0x02, 0x2B, 0x02, 0x03, 0x42, 0x06, 0x10, 0x0F, 0x2E, 0x3F, 0x0D]
      - [0xB9, 0x23, 0x23]
      - [0xBF, 0x10, 0x14, 0x14, 0x0B, 0x0B, 0x0B]
      - [0xF2, 0x00]
      - [0x73, 0x04, 0xDA, 0x12, 0x54, 0x47]
      - [0x77, 0x6B, 0x5B, 0xFD, 0xC3, 0xC5]
      - [0x7A, 0x15, 0x27]
      - [0x7B, 0x04, 0x57]
      - [0x7E, 0x01, 0x0E]
      - [0xBF, 0x36]
      - [0xE3, 0x40, 0x40]
      - [0xF0, 0x00]
      - [0xD0, 0x00]
      - [0x11]
      - delay 120ms
    lambda: |-
      const int W = 480;
      it.fill(Color(0x1E, 0x1E, 0x1E));

      // 顶部：标题 + 时间
      it.print(16, 10, id(f22), Color(0x4F, 0xD8, 0xFA), "Pocket HomeAssistant");
      if (id(ha_time).now().is_valid()) {
        it.strftime(W - 120, 10, id(f22), Color(255, 255, 255), "%H:%M", id(ha_time).now());
      } else {
        it.print(W - 120, 10, id(f22), Color(0x75, 0x75, 0x75), "--:--");
      }
      it.line(16, 44, W - 16, 44, Color(0x3A, 0x3A, 0x3A));

      // 左栏：网络
      it.print(16, 60, id(f22), Color(0xFF, 0xB7, 0x4D), "WiFi");
      if (!std::isnan(id(wifi_db).state)) {
        it.printf(110, 60, id(f22), Color(255, 255, 255), "%.0f dBm", id(wifi_db).state);
      }
      it.printf(16, 96, id(f22), Color(255, 255, 255), "IP %s", id(ip_addr).state.c_str());
      it.printf(16, 132, id(f22), Color(255, 255, 255), "UP %u s", (unsigned) (millis() / 1000));

      // 右栏：电池（未接电池时电压接近 0，显示 --）
      it.print(280, 60, id(f22), Color(0x59, 0xD9, 0x8B), "BAT");
      if (!std::isnan(id(bat_volt).state) && id(bat_volt).state > 2.5f) {
        auto c = id(bat_pct).state > 20.0f ? Color(0x59, 0xD9, 0x8B) : Color(0xFF, 0x52, 0x52);
        it.printf(280, 96, id(f22), c, "%.0f%%", id(bat_pct).state);
        it.printf(280, 132, id(f22), Color(255, 255, 255), "%.2f V", id(bat_volt).state);
      } else {
        it.print(280, 96, id(f22), Color(0x75, 0x75, 0x75), "--");
      }

      // 底部提示
      it.print(16, 200, id(f22), Color(0x75, 0x75, 0x75), "BOOT: backlight on/off");

      // ── 触摸调试区：点屏幕任意位置，这里显示原始坐标和映射后坐标 ──
      // taps 计数：每成功触发一次"按下"就 +1，用来确认可以反复点击
      auto t = id(ts).get_touch();
      if (t.has_value()) {
        it.filled_circle(t->x, t->y, 8, Color(0xFF, 0x52, 0x52));
        it.printf(16, 240, id(f22), Color(0xFF, 0xE0, 0x82), "raw %d,%d", t->x_raw, t->y_raw);
        it.printf(16, 276, id(f22), Color(0x8B, 0xC3, 0x4A), "map %d,%d", t->x, t->y);
      } else {
        it.print(16, 240, id(f22), Color(0x75, 0x75, 0x75), "tap screen to test");
      }
      it.printf(300, 240, id(f22), Color(0x90, 0xCA, 0xF9), "taps %u", (unsigned) id(tap_count));

# ── 触摸：ST77922 内置 TDDI 触摸（本仓库自定义组件 components/st77922_touch）──
external_components:
  - source:
      type: local
      path: components
    components: [st77922_touch]

# 这颗芯片是触显一体：显示和触摸在同一颗 die，触摸走独立 I2C 地址 0x55。
# 坐标映射（tab1/2/4 三角实测标定）：芯片原生坐标是竖屏 320x480，
# 屏幕横装后：显示横向 = 原生纵向（不反转）、显示纵向 = 320 - 原生横向（反转）。
# 换轴已在自定义组件内完成（基类 transform 的 swap_xy 在 2026.10.2 运行时不生效），
# 这里 calibration 保持 1:1（0..480 / 0..320），mirror_y 负责纵向反转。
# 若点哪画哪仍对不上，按 docs/触摸-ST77922.md 的校准表调 mirror_x / mirror_y。
globals:
  - id: tap_count
    type: unsigned
    restore_value: no
    initial_value: "0"

touchscreen:
  - platform: st77922_touch
    id: ts
    display: lcd
    reset_pin: GPIO48
    update_interval: 50ms
    calibration:
      x_min: 0
      x_max: 480
      y_min: 0
      y_max: 320
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: true
    on_touch:
      - lambda: |-
          id(tap_count) += 1;
          ESP_LOGI("touch", "#%u screen=(%d,%d) raw=(%d,%d) z=%d", (unsigned) id(tap_count), touch.x,
                   touch.y, touch.x_raw, touch.y_raw, touch.z_raw);
